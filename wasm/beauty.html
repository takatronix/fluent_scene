<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fluent scene — beauty filter</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 12px;
         background: radial-gradient(120% 120% at 50% 0%, #1a141b 0%, #0a070b 70%);
         color: #e8dfe6; font: 14px/1.5 system-ui, sans-serif; }
  #v { display: block; width: min(96vw, calc(78vh * 16 / 9), 1280px);
       aspect-ratio: 16 / 9;
       background: #000; border-radius: 14px;
       box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.5);
       touch-action: none; user-select: none; cursor: ew-resize; }
  #panel { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center;
           padding: 10px 22px; border-radius: 12px; background: rgba(255,255,255,0.05); }
  #panel label { display: flex; flex-direction: column; align-items: center; gap: 2px;
                 font-size: 12px; color: #b9a8b5; }
  #panel output { font-family: ui-monospace, monospace; font-size: 11px; color: #7c6a78; }
  input[type=range] { width: 130px; accent-color: #d98d9e; }
  #bar { font-family: ui-monospace, monospace; color: #8a7886; font-size: 12px;
         white-space: pre-wrap; text-align: center; }
</style>
<canvas id="v" width="1280" height="720"></canvas>
<div id="panel">
  <label>美肌 <input id="smoothing" type="range" min="0" max="1" step="0.01" value="0.8"><output>0.80</output></label>
  <label>美白 <input id="whiten" type="range" min="0" max="1" step="0.01" value="0.25"><output>0.25</output></label>
  <label>シャープ <input id="sharpen" type="range" min="0" max="1" step="0.01" value="0.15"><output>0.15</output></label>
  <label>ノイズリダクション <input id="denoise" type="range" min="0" max="1" step="0.01" value="0.35"><output>0.35</output></label>
  <label>半径 <input id="radius" type="range" min="2" max="24" step="1" value="10"><output>10</output></label>
</div>
<div id="bar">loading wasm…</div>
<script type="module">
// Beauty filter demo — the gpupixel/FaceBetter smoothing core (variance-gated
// local Wiener filter + red-channel skin gate) as a fluent_scene filter,
// running entirely in this tab. Drag the divider to wipe original vs beauty;
// the sliders drive the filter parameters live through fs_layer_set_filter.
import createFluentScene from './fluent_scene.mjs';

const SCENE = `
schema: fluent.scene/v1alpha2
stage: { size: [1280, 720] }
inputs:
  camera: { type: image.rgba8, update: per_frame }
  grade: { type: image.rgba8 }
params:
  wipe_win: { type: vec2, default: [0, 360], runtime_mutable: true,
              animate: { duration: 0.1, ease: ease_out } }
  wipe_inv: { type: vec2, default: [1280, 360], runtime_mutable: true,
              animate: { duration: 0.1, ease: ease_out } }
  divider: { type: vec2, default: [640, 360], runtime_mutable: true,
             animate: { duration: 0.1, ease: ease_out } }
layers:
  - id: after
    content: { image: { source: $inputs.camera, fit: cover } }
    filters: [ { beauty: { smoothing: 0.8, whiten: 0, radius: 10, sharpen: 0.15, denoise: 0.35 } },
               { lut: { source: $inputs.grade, amount: 1, skin: 1 } } ]
  - id: before_win
    bounds: [0, 0, 1280, 720]
    masks_to_bounds: true
    position: $params.wipe_win
    sublayers:
      - bounds: [0, 0, 1280, 720]
        position: $params.wipe_inv
        content: { image: { source: $inputs.camera, fit: cover } }
  - id: divider_line
    position: $params.divider
    content: { rect: { size: [3, 720], color: [1, 1, 1, 0.55] } }
  - id: hud
    position: [28, 24]
    opacity: 0.94
    shadow: {}
    sublayers:
      - content: { rect: { size: [420, 64], corner_radius: 16, color: [0, 0, 0, 0.42] } }
      - content: { text: { text: "BEAUTY FILTER", position: [20, 8], size: 30 } }
      - content: { text: { text: "gpupixel algorithm on fluent_scene, in wasm", position: [20, 40],
                           size: 15, color: [1, 1, 1, 0.55] } }
  - content: { text: { text: "original", position: [24, 682], size: 15,
                       color: [1, 1, 1, 0.65] } }
  - content: { text: { text: "beauty", position: [1190, 682], size: 15,
                       color: [1, 1, 1, 0.65] } }
`;

const bar = document.getElementById('bar');
let canvas = document.getElementById('v');
let ctx = null;  // 2d context only on the CPU path (a webgpu canvas can't have one)

const mod = await createFluentScene();
const fs = {
  create: mod.cwrap('fs_create', 'number', ['number']),
  error: mod.cwrap('fs_error', 'string', []),
  stageW: mod.cwrap('fs_stage_width', 'number', ['number']),
  stageH: mod.cwrap('fs_stage_height', 'number', ['number']),
  imageBuffer: mod.cwrap('fs_image_buffer', 'number', ['number', 'string', 'number', 'number']),
  commitImage: mod.cwrap('fs_commit_image', 'number', ['number', 'string', 'number', 'number']),
  render: mod.cwrap('fs_render', 'number', ['number', 'number', 'number', 'number']),
  renderW: mod.cwrap('fs_render_width', 'number', ['number']),
  renderH: mod.cwrap('fs_render_height', 'number', ['number']),
  renderStride: mod.cwrap('fs_render_stride', 'number', ['number']),
  setParamVec2: mod.cwrap('fs_set_param_vec2', 'number', ['number', 'string', 'number', 'number']),
  layerSetFilter: mod.cwrap('fs_layer_set_filter', 'number',
      ['number', 'string', 'string', 'number', 'number', 'number', 'number', 'number']),
};

const yamlPtr = mod.stringToNewUTF8(SCENE);
const inst = fs.create(yamlPtr);
if (!inst) {
  bar.textContent = 'scene rejected:\n' + fs.error();
  throw new Error(fs.error());
}
const stageW = fs.stageW(inst), stageH = fs.stageH(inst);

// ---- backend choice: WebGPU when the browser has it, CPU otherwise --------
// (the demo.html pattern: probe, init against the canvas, fall back on any
// failure — the page never blackscreens)
let gpu = false;
try {
  if (navigator.gpu) {
    const gInit = mod.cwrap('fs_webgpu_init', null, ['string']);
    const gStatus = mod.cwrap('fs_webgpu_status', 'number', []);
    const gError = mod.cwrap('fs_webgpu_error', 'string', []);
    fs.gRender = mod.cwrap('fs_render_webgpu', 'number', ['number', 'number', 'number', 'number']);
    gInit('#v');
    bar.textContent = 'waiting for WebGPU device…';
    gpu = await new Promise(resolve => {
      const t0 = performance.now();
      (function poll() {
        const s = gStatus();
        if (s === 1) return resolve(true);
        if (s === -1) { console.error('beauty: WebGPU init failed:', gError()); return resolve(false); }
        if (performance.now() - t0 > 5000) { console.error('beauty: WebGPU init timeout'); return resolve(false); }
        requestAnimationFrame(poll);
      })();
    });
  }
} catch (e) {
  console.error('beauty: WebGPU unavailable, using CPU renderer:', e);
  gpu = false;
}
if (!gpu) ctx = canvas.getContext('2d');
fs.gStatus = gpu ? mod.cwrap('fs_webgpu_status', 'number', []) : () => -1;

function fallbackToCpu(why) {
  if (!gpu) return;
  gpu = false;
  console.error('beauty: falling back to CPU renderer:', why);
  const fresh = canvas.cloneNode(false);
  fresh.width = 1280;   // drop any retina-scaled backing — CPU can't afford it
  fresh.height = 720;
  canvas.replaceWith(fresh);
  canvas = fresh;
  hookWipe(canvas);
  ctx = canvas.getContext('2d');
}

// ---- the wipe: original on the left of the divider, beauty on the right ----
// before_win is a full-stage masked window slid left so it covers [s-1280, s];
// the inner camera image is counter-shifted so its pixels stay aligned with
// the filtered layer beneath. Positions are layer centers.
function setWipe(s) {
  s = Math.max(0, Math.min(stageW, s));
  fs.setParamVec2(inst, 'wipe_win', s - 640, 360);
  fs.setParamVec2(inst, 'wipe_inv', 1920 - s, 360);
  fs.setParamVec2(inst, 'divider', s, 360);
}

let dragging = false;
function hookWipe(el) {
  el.addEventListener('pointerdown', e => {
    dragging = true; el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    setWipe((e.clientX - r.left) / r.width * stageW);
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = el.getBoundingClientRect();
    setWipe((e.clientX - r.left) / r.width * stageW);
  });
  el.addEventListener('pointerup', () => { dragging = false; });
}
hookWipe(canvas);

// ---- the whiten grade: gpupixel's real LUT chain, baked ---------------------
// base = the chain at strength 0, full = at strength 1; the original's
// whiten w is exactly mix(base(c), full(c), w), which in LUT domain is a
// per-texel blend of the two atlases. w = 0 bypasses the chain entirely
// (identity), faithfully reproducing gpupixel's own 0→ε discontinuity.
const LUT_W = 512;
async function loadAtlas(url) {
  const bmp = await createImageBitmap(await (await fetch(url)).blob());
  const c = new OffscreenCanvas(LUT_W, LUT_W);
  const cx = c.getContext('2d');
  cx.drawImage(bmp, 0, 0);
  return cx.getImageData(0, 0, LUT_W, LUT_W).data;
}
const [lutBase, lutFull] = await Promise.all(
    [loadAtlas('./luts/whiten_base_64.png'), loadAtlas('./luts/whiten_full_64.png')]);

function pushWhiten(w) {
  if (w <= 0) {
    fs.layerSetFilter(inst, 'after', 'lut', 0, 1, 0, 0, 0);  // amount 0 = identity
    return;
  }
  const ptr = fs.imageBuffer(inst, 'grade', LUT_W, LUT_W);
  const heap = mod.HEAPU8;
  for (let i = 0; i < lutBase.length; ++i) {
    heap[ptr + i] = lutBase[i] + (lutFull[i] - lutBase[i]) * w;
  }
  fs.commitImage(inst, 'grade', LUT_W, LUT_W);
  // amount 1, skin 1: gpupixel's real chain, but scoped to skin chroma —
  // shirts and background keep their color (the original whitens everything).
  fs.layerSetFilter(inst, 'after', 'lut', 1, 1, 0, 0, 0);
}
pushWhiten(0.25);

// ---- sliders → live filter parameters --------------------------------------
const sliders = ['smoothing', 'whiten', 'sharpen', 'denoise', 'radius']
    .map(id => document.getElementById(id));
function pushFilter() {
  const [sm, wh, sh, dn, ra] = sliders.map(s => Number(s.value));
  for (const s of sliders) {
    s.nextElementSibling.textContent = s.id === 'radius' ? s.value : Number(s.value).toFixed(2);
  }
  // filters_def.h slot order: smoothing, whiten, radius, sharpen, denoise —
  // the procedural whiten stays 0; the real LUT chain carries whitening now.
  fs.layerSetFilter(inst, 'after', 'beauty', sm, 0, ra, sh, dn);
  pushWhiten(wh);
}
for (const s of sliders) s.addEventListener('input', pushFilter);

// ---- webcam → wasm heap ----------------------------------------------------
const res = new URLSearchParams(location.search).get('res');
if (res && /^\d+x\d+$/.test(res)) {
  const [rw, rh] = res.split('x').map(Number);
  canvas.width = rw; canvas.height = rh;
}
// 720p capture: the 640x480 feed upscaled 2x was half the softness — the
// filter can only keep detail the camera delivered. `ideal` is a request,
// not a promise: the grab canvas takes the ACTUAL video size afterwards,
// so a camera that answers 4:3 is never stretched to 16:9 (the scene's
// cover fit does the aspect-correct crop instead).
let CAM_W = 1280, CAM_H = 720;
const grab = document.createElement('canvas');
const grabCtx = grab.getContext('2d', { willReadFrequently: true });
let video = null;
try {
  const stream = await navigator.mediaDevices.getUserMedia(
      { video: { width: { ideal: CAM_W }, height: { ideal: CAM_H } }, audio: false });
  video = document.createElement('video');
  video.srcObject = stream; video.muted = true;
  await video.play();
  CAM_W = video.videoWidth || CAM_W;
  CAM_H = video.videoHeight || CAM_H;
  grab.width = CAM_W;
  grab.height = CAM_H;
} catch (e) {
  bar.textContent = 'webcam: ' + e + ' (needs https or localhost)';
}

// ---- render resolution ------------------------------------------------------
// On the GPU the canvas renders at device pixels (a 1280 CSS-px canvas on a
// retina display needs 2560 backing pixels to look sharp — SDF rendering is
// resolution-independent, so this is free crispness). The adaptive ladder
// only exists for the CPU fallback.
let last = performance.now(), frames = 0, fpsShown = 0;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
if (!res && gpu && DPR > 1) { canvas.width = 1280 * DPR; canvas.height = 720 * DPR; }
const LADDER = [[1280, 720], [1024, 576], [854, 480], [640, 360]];
let rung = 0;
setInterval(() => {
  fpsShown = frames; frames = 0;
  if (res || gpu) return;
  // Down only — see lsd.html: the up-step made the rung oscillate visibly.
  if (fpsShown > 0 && fpsShown < 24 && rung < LADDER.length - 1) ++rung;
  const [w, h] = LADDER[rung];
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
}, 1000);

function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (video && video.readyState >= 2) {
    grabCtx.drawImage(video, 0, 0, CAM_W, CAM_H);
    const data = grabCtx.getImageData(0, 0, CAM_W, CAM_H).data;
    const ptr = fs.imageBuffer(inst, 'camera', CAM_W, CAM_H);
    mod.HEAPU8.set(data, ptr);
    fs.commitImage(inst, 'camera', CAM_W, CAM_H);
  }

  if (gpu) {
    if (fs.gStatus() !== 1) {
      fallbackToCpu('device left ready state');
    } else if (!fs.gRender(inst, dt, canvas.width, canvas.height)) {
      fallbackToCpu('fs_render_webgpu failed');
    }
  }
  if (!gpu) {
    const px = fs.render(inst, dt, canvas.width, canvas.height);
    const w = fs.renderW(inst), h = fs.renderH(inst), stride = fs.renderStride(inst);
    if (w === canvas.width && stride === w * 4) {
      const view = new Uint8ClampedArray(mod.HEAPU8.buffer, px, w * h * 4);
      ctx.putImageData(new ImageData(view, w, h), 0, 0);
    }
  }
  ++frames;
  bar.textContent = `${canvas.width}x${canvas.height} · ${fpsShown} fps · wasm/${gpu ? 'webgpu' : 'cpu'} — ドラッグで境界を動かす。左が原画、右が美肌`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
