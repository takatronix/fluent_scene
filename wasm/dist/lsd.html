<script type="module">
// LSD demo — the serotonergic visual phenomenology as one fluent_scene
// filter (fs_lsd: drifting, breathing, diffraction fringes, Klüver form
// constants through the retino-cortical log map), plus the one thing a
// single-pass filter cannot do: FEEDBACK. Tracers, palinopsia, and
// recursive tunneling all come from re-entering the previous *output* into
// the next frame's input, slightly zoomed and rotated — closed here with
// two canvases before the pixels enter the wasm heap.
import createFluentScene from './fluent_scene.mjs';

// Portrait phones get a portrait pipeline: camera, feedback plane, stage,
// and canvas all share the viewport's orientation, so nobody gets
// cover-cropped into a face closeup. Rotation reloads with the other set.
const portrait = matchMedia('(orientation: portrait)').matches;
matchMedia('(orientation: portrait)').addEventListener('change', () => location.reload());
// The stage takes the SCREEN's own aspect (tall iPhones are 9:19.5,
// not 9:16 — a fixed stage got cover-cropped ~20% = "zoomed in"). The
// long side stays 1280; the short side follows the viewport.
const vw = Math.max(320, window.innerWidth), vh = Math.max(320, window.innerHeight);
const STAGE_W = portrait ? Math.round(1280 * vw / vh / 4) * 4 : 1280;
const STAGE_H = portrait ? 1280 : Math.round(1280 * vh / vw / 4) * 4;

const SCENE = `
schema: fluent.scene/v1alpha2
stage: { size: [${STAGE_W}, ${STAGE_H}] }
inputs:
  camera: { type: image.rgba8, update: per_frame }
params:
  bodymix: { type: f32, default: 0, runtime_mutable: true }
layers:
  - id: live
    content: { image: { source: $inputs.camera, fit: cover } }
    filters: [ { lsd: { trip: 0.8, time: 0, drift: 1, geometry: 0.5, chroma: 1 } } ]
  - id: body
    frame: [0, 0, ${STAGE_W}, ${STAGE_H}]
    opacity: $params.bodymix
    blend: screen
    content: { image: { source: $inputs.camera, fit: cover } }
    filters: [ { fractal: { flight: 0.4, time: 0, morph: 0.8, glow: 1.0, blend: 0 } } ]
`;
// the 3D glowing body (fs_fractal, screen-blended over the trip) only runs
// on the WebGPU path — the CPU fallback keeps bodymix at 0 and never pays
// for the raymarch. Blinks teleport its epoch; the come-up fades it in.
// The title lives in HTML, not in the scene: the canvas is cover-cropped to
// the viewport, so anything drawn at stage coordinates walks off the edge on
// a non-16:9 window — and a burned-in HUD would also re-enter the feedback
// loop and smear.

const bar = document.getElementById('bar');
let canvas = document.getElementById('v');
let ctx = null;  // taken only on the CPU fallback

const mod = await createFluentScene();
const fs = {
  create: mod.cwrap('fs_create', 'number', ['number']),
  error: mod.cwrap('fs_error', 'string', []),
  imageBuffer: mod.cwrap('fs_image_buffer', 'number', ['number', 'string', 'number', 'number']),
  commitImage: mod.cwrap('fs_commit_image', 'number', ['number', 'string', 'number', 'number']),
  render: mod.cwrap('fs_render', 'number', ['number', 'number', 'number', 'number']),
  renderW: mod.cwrap('fs_render_width', 'number', ['number']),
  renderH: mod.cwrap('fs_render_height', 'number', ['number']),
  renderStride: mod.cwrap('fs_render_stride', 'number', ['number']),
  layerSetFilter: mod.cwrap('fs_layer_set_filter', 'number',
      ['number', 'string', 'string', 'number', 'number', 'number', 'number', 'number']),
  gInit: mod.cwrap('fs_webgpu_init', null, ['string']),
  gStatus: mod.cwrap('fs_webgpu_status', 'number', []),
  gError: mod.cwrap('fs_webgpu_error', 'string', []),
  gRender: mod.cwrap('fs_render_webgpu', 'number', ['number', 'number', 'number', 'number']),
  gReadLast: mod.cwrap('fs_webgpu_read_last', 'number', ['number', 'number']),
  gReadPixels: mod.cwrap('fs_webgpu_read_pixels', 'number', []),
  setPf: mod.cwrap('fs_set_param_f32', 'number', ['number', 'string', 'number']),
};
fs.gInit('#v');
let mode = 'boot';
const bootAt = performance.now();
// GPU tracers: the echo comes home through an async readback (1–2 frames
// late — palinopsia does not mind). One in flight, read in the same rAF
// discipline that the fractal page's probe taught us. gReadLast re-reads
// the frame gRender just drew — the old gReadBegin re-RENDERED the whole
// scene at echo size, which both doubled the raymarch cost and thrashed
// the renderer's canvas texture between the two sizes every frame (the
// iPhone "old frame pops in" stutter).
let rbBusy = false;
let bodyEpoch = 137 + Math.random() * 2800;
// The echo advances at the CPU era's ~9 generations/s NO MATTER the display
// fps. Each generation passes the history through the filter again (chroma
// shift, max-composite, geometry), so generation RATE — not just per-second
// decay — sets the loop gain. Ungated at 60 fps the loop ran ~30 gen/s:
// 4× the amplification the look was tuned at, and the picture saturated
// into flat rainbow fields within seconds of going WebGPU ("CPUと全然
// ちがう"). dt-normalizing the decay alone cannot fix that — the filter is
// a nonlinear amplifier applied once per generation.
const ECHO_MS = 110;
let lastEchoBeginAt = -1e9, lastComposeAt = -1e9;
function pumpEcho() {
  if (rbBusy || mode !== 'gpu') return;
  const nowE = performance.now();
  if (nowE - lastEchoBeginAt < ECHO_MS * 0.5) return;
  lastEchoBeginAt = nowE;
  rbBusy = true;
  try {
    if (!fs.gReadLast(CAM_W, CAM_H)) { rbBusy = false; return; }
  } catch (e) { rbBusy = false; return; }
  const poll = () => {
    let px = 0;
    try { px = fs.gReadPixels(); }
    catch (e) { rbBusy = false; return; }
    if (!px) {
      if (fs.gStatus() === -1) { rbBusy = false; return; }
      requestAnimationFrame(poll); return;
    }
    const img = new ImageData(
        new Uint8ClampedArray(mod.HEAPU8.buffer, px, CAM_W * CAM_H * 4).slice(),
        CAM_W, CAM_H);
    prevCtx.putImageData(img, 0, 0);
    hasPrev = true;
    rbBusy = false;
  };
  requestAnimationFrame(poll);
}

const yamlPtr = mod.stringToNewUTF8(SCENE);
const inst = fs.create(yamlPtr);
if (!inst) {
  bar.textContent = 'scene rejected:\n' + fs.error();
  throw new Error(fs.error());
}


// ---- language ---------------------------------------------------------------
// ?lang= wins (the English report links here with it), then a remembered
// choice, then the browser. Labels carry data-k; only the English strings
// live here, so Japanese needs no table.
const EN = {
  pharma: 'PHARMACOLOGY', recur: 'RECURSION', flux: 'FLUX',
  trip: 'Trip', drift: 'Drift', geometry: 'Geometry', texture: 'Texture',
  chroma: 'Chroma', persist: 'Persistence', zoom: 'Zoom', swirl: 'Swirl',
  trail: 'Trail', auto: 'Auto-flux', depth: 'Depth', gaze: 'Gaze',
  organic: 'Organic', digital: 'Digital', smooth: 'Smooth', glow: 'Glow trails',
  fullscreen: 'Fullscreen', settings: 'Settings',
  report: 'Read the report — why it looks like this →',
};
const qLang = new URLSearchParams(location.search).get('lang');
const savedLang = localStorage.getItem('lsd_lang');
let LANG = qLang ? (qLang === 'en' ? 'en' : 'ja')
         : savedLang ? savedLang
         : (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';

const JA = {}, JAT = {};
document.querySelectorAll('[data-k]').forEach(el => { JA[el.dataset.k] = el.textContent; });
// data-kt marks the icon buttons: their glyph must survive, only the
// tooltip changes language
document.querySelectorAll('[data-kt]').forEach(el => { JAT[el.dataset.kt] = el.title; });
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-k]').forEach(el => {
    const v = LANG === 'en' ? EN[el.dataset.k] : JA[el.dataset.k];
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-kt]').forEach(el => {
    const v = LANG === 'en' ? EN[el.dataset.kt] : JAT[el.dataset.kt];
    if (v) { el.title = v; el.setAttribute('aria-label', v); }
  });
  const rl = document.getElementById('reportlink');
  if (rl) rl.href = LANG === 'en' ? 'lsd_report.en.html' : 'lsd_report.html';
  const lb = document.getElementById('langbtn');
  if (lb) { lb.textContent = LANG === 'en' ? '日本' : 'EN'; }
}
applyLang();
document.getElementById('langbtn').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'ja' : 'en';
  localStorage.setItem('lsd_lang', LANG);
  applyLang();
});
const T = (ja, en) => (LANG === 'en' ? en : ja);

// ---- sliders ---------------------------------------------------------------
const ids = ['trip', 'drift', 'geometry', 'chroma', 'persist', 'zoom', 'rot', 'depth'];
const sl = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
const trailmode = document.getElementById('trailmode');
const autoBox = document.getElementById('auto');
function labels() {
  for (const id of ids) {
    sl[id].nextElementSibling.textContent = Number(sl[id].value).toFixed(2);
  }
}
for (const id of ids) sl[id].addEventListener('input', labels);
labels();
// the freshly-loaded state — what a long eye closure resets back to
const DEFAULTS = Object.fromEntries(ids.map(d => [d, Number(sl[d].value)]));

// ---- immersive chrome ------------------------------------------------------
// The view fills the screen; controls live in a drawer behind ⚙. Browsers
// refuse fullscreen without a user gesture, so "fullscreen by default"
// becomes: first touch enters it (touch devices), double-tap and ⛶ toggle.
const drawer = document.getElementById('drawer');
document.getElementById('gear').addEventListener('click',
    () => drawer.classList.toggle('open'));
const fsToggle = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.getElementById('fsbtn').addEventListener('click', fsToggle);
let lastTap = 0, fsTried = false;
const coarse = matchMedia('(pointer: coarse)').matches;
canvas.addEventListener('pointerup', () => {
  const now = performance.now();
  if (coarse && !fsTried && !document.fullscreenElement) {
    fsTried = true;
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (now - lastTap < 350) {
    fsToggle();
  }
  lastTap = now;
});
// the drawer starts closed everywhere — the picture is the whole interface

// ---- the trip conductor ----------------------------------------------------
// LSD visuals are non-stationary: the brain's dynamical-state repertoire
// expands (Tagliazucchi 2014, Atasoy 2017) and temporal fluctuations turn
// scale-free (Varley 2020) — so the same picture never comes twice, and
// regime changes arrive at every speed: unnoticed drifts, slow morphs,
// sudden snaps. Model: each parameter wanders around its slider baseline
// with (a) slow incommensurate micro-jitter and (b) Poisson-arriving
// metastable jumps whose transition time is log-uniform in 0.25–20 s —
// the heavy tail is what makes some changes "パッ" and others glacial.
const DIMS = {
  trip:     { span: 0.35, min: 0,     max: 1.5  },
  drift:    { span: 0.9,  min: 0,     max: 3    },
  geometry: { span: 0.5,  min: 0,     max: 1.5  },
  chroma:   { span: 0.9,  min: 0,     max: 3    },
  persist:  { span: 0.18, min: 0,     max: 0.95 },
  zoom:     { span: 0.16, min: -0.4,  max: 0.4  },
  rot:      { span: 0.22, min: -0.6,  max: 0.6  },
};
const conductor = { from: {}, to: {}, jitterF: {}, jitterP: {}, t0: 0, dur: 1, next: 0 };
for (const d in DIMS) {
  conductor.from[d] = 0; conductor.to[d] = 0;
  conductor.jitterF[d] = 0.05 + 0.1 * Math.random();   // incommensurate per load
  conductor.jitterP[d] = Math.random() * 6.28;
}
function conduct(t) {
  const depth = Number(sl.depth.value);
  // every blink moves the trip along: a fresh jump, and a fast one, so the
  // scene has visibly turned over by the time the eyes are open again
  const snap = blinkJump;
  if (snap) { conductor.next = t; blinkJump = false; }
  if (t >= conductor.next) {                            // a metastable jump
    for (const d in DIMS) {
      conductor.from[d] = currentOffset(d, t);
      conductor.to[d] = (Math.random() * 2 - 1) * DIMS[d].span;
    }
    conductor.t0 = t;
    conductor.dur = snap ? 0.2 + 0.5 * Math.random()
                        : 0.25 * Math.pow(80, Math.random());  // log-uniform
    conductor.next = t + 3 + 17 * -Math.log(1 - Math.random());
  }
  const eff = {};
  for (const d in DIMS) {
    const jit = 0.25 * DIMS[d].span *
        Math.sin(t * conductor.jitterF[d] + conductor.jitterP[d]);
    eff[d] = clampDim(d, Number(sl[d].value) + depth * (currentOffset(d, t) + jit));
  }
  // recursion budget: deep persistence AND a fast vortex together turn the
  // echo into a saturated ring tunnel that eats the camera (真ん中のウズ).
  // The conductor may spend one or the other, never both — when the product
  // exceeds the budget, the vortex yields (trails feel is the rarer prize).
  const rec = (eff.persist / DIMS.persist.max) *
      (Math.abs(eff.zoom) / DIMS.zoom.max + Math.abs(eff.rot) / DIMS.rot.max);
  if (rec > 0.55) {
    const k = 0.55 / rec;
    eff.zoom *= k;
    eff.rot *= k;
  }
  return eff;
}
function currentOffset(d, t) {
  const u = Math.min((t - conductor.t0) / conductor.dur, 1);
  const e = u * u * (3 - 2 * u);                        // smoothstep ease
  return conductor.from[d] + (conductor.to[d] - conductor.from[d]) * e;
}
function clampDim(d, v) { return Math.min(DIMS[d].max, Math.max(DIMS[d].min, v)); }

// ---- webcam ----------------------------------------------------------------
// 16:9 capture so camera, feedback plane, and stage share one aspect —
// a mismatch here would make the fed-back echo slide against the image.
const CAM_W = portrait ? 360 : 640, CAM_H = portrait ? 640 : 360;
let video = null;
async function camUp() {
  if (video) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia(
        { video: { width: CAM_W, height: CAM_H }, audio: false });
    const v = document.createElement('video');
    v.srcObject = stream; v.muted = true;
    v.playsInline = true;                    // iOS: mandatory for inline play
    v.setAttribute('playsinline', '');
    await v.play();
    video = v;
  } catch (e) {
    bar.textContent = 'webcam: ' + e + ' (needs https / タップで再試行)';
  }
}
await camUp();
document.addEventListener('pointerdown', () => { if (!video) camUp(); }, { passive: true });

// ---- gaze analyzer (MediaPipe iris, ~10 Hz, from the gaze demo) ------------
// The hallucination follows the eyes: the feedback vortex pivots to the
// gaze point, and holding eye contact with the camera deepens the trip.
// Auto-calibrates a neutral gaze on first sight (persisted in localStorage).
const grab = document.createElement('canvas');
grab.width = CAM_W; grab.height = CAM_H;
const grabCtx = grab.getContext('2d', { willReadFrequently: true });
const gazechk = document.getElementById('gazechk');
let gazePivot = { x: CAM_W / 2, y: CAM_H / 2 };
let gazeRaw = null, contactLevel = 0, faceSeen = 0;
// a blink is a moment of no retinal input at all — the geometry the
// closed eye sees surges, then settles. Detected already; now used.
let blinkPulse = 0, wasBlink = false, blinkJump = false;
// 閉眼リセット: まばたきは素通し、目を閉じ続けるほど世界が初期状態へ
// 洗い流される(長い閉眼=完全リセット)
let eyeState = 'open', eyesClosedAt = 0, closedLevel = 0, cevArmed = false;
let blinkSnap = false, blinkReset = false;
let tripT0 = 0;  // when the come-up (re)started — the trip builds from here
let gbias = { yaw: 0, pitch: 0 }, gcalib = [];
try {
  const b = JSON.parse(localStorage.getItem('lsd_gaze_bias'));
  if (b) { gbias = b; gcalib = null; }
} catch (e) {}
let landmarker = null;
(async () => {
  try {
    const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await import(`${MP}/vision_bundle.mjs`);
    const files = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const make = d => vision.FaceLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: d,
      },
      outputFacialTransformationMatrixes: true, runningMode: 'VIDEO', numFaces: 1,
    });
    try { landmarker = await make('GPU'); }
    catch (e) { landmarker = await make('CPU'); }
  } catch (e) { console.error('gaze analyzer unavailable:', e); }
})();
function irisOffset(lm, inner, outer, top, bottom, iris) {
  const w = lm[outer].x - lm[inner].x;
  const h = lm[bottom].y - lm[top].y;
  if (Math.abs(w) < 1e-4) return null;
  return {
    hx: (lm[iris].x - lm[inner].x) / w - 0.5,
    vy: Math.abs(h) > 1e-4 ? (lm[iris].y - lm[top].y) / h - 0.5 : 0,
    open: Math.abs(h / w),
  };
}
function headPose(m) {
  const zx = m[8], zy = m[9], zz = m[10];
  return { yaw: Math.atan2(zx, Math.abs(zz)),
           pitch: Math.atan2(zy, Math.hypot(zx, zz)) };
}
setInterval(() => {
  if (!landmarker || !gazechk.checked || !video || video.readyState < 2) return;
  drawCover(grabCtx, video, video.videoWidth || 640, video.videoHeight || 360);
  const r = landmarker.detectForVideo(grab, performance.now());
  if (!(r.faceLandmarks && r.faceLandmarks.length)) return;
  const lm = r.faceLandmarks[0];
  faceSeen = performance.now();
  let head = { yaw: 0, pitch: 0 };
  if (r.facialTransformationMatrixes && r.facialTransformationMatrixes.length) {
    head = headPose(r.facialTransformationMatrixes[0].data);
  }
  const R = irisOffset(lm, 133, 33, 159, 145, 468);
  const L = irisOffset(lm, 362, 263, 386, 374, 473);
  let eyeYaw = 0, eyePitch = 0, blink = false;
  if (R && L) {
    const openAvg = (R.open + L.open) / 2;
    blink = openAvg < 0.09;
    // the closure detector is deliberately laxer than the gaze guard:
    // phone landmarkers under-report closure on small faces
    if (openAvg < 0.13) {
      if (eyeState !== 'closed') {
        eyeState = 'closed';
        eyesClosedAt = performance.now();
      }
    } else {
      if (eyeState === 'closed' && performance.now() - eyesClosedAt < 450) {
        const roll = Math.random();
        if (roll < 0.25) {
          blinkSnap = true;    // 1/4: the world flips — 「パッ」
        } else if (roll < 0.5) {
          blinkReset = true;   // 1/4: the world starts over
        }                      // 2/4: the blink passes unnoticed
      }
      eyeState = 'open';
    }
    if (!blink) {
      eyeYaw = ((R.hx + L.hx) / 2) * 1.6;
      eyePitch = -((R.vy + L.vy) / 2) * 0.8;
    }
  }
  if (blink && !wasBlink) { blinkPulse = 1; blinkJump = true; }
  wasBlink = blink;
  const rawYaw = head.yaw + eyeYaw, rawPitch = head.pitch + eyePitch;
  if (gcalib !== null && !blink) {
    gcalib.push([rawYaw, rawPitch]);
    if (gcalib.length >= 15) {
      gbias.yaw = gcalib.reduce((s, v) => s + v[0], 0) / gcalib.length;
      gbias.pitch = gcalib.reduce((s, v) => s + v[1], 0) / gcalib.length;
      localStorage.setItem('lsd_gaze_bias', JSON.stringify(gbias));
      gcalib = null;
    }
  }
  const cl = a => Math.max(-0.9, Math.min(0.9, a));
  const yaw = cl(rawYaw - gbias.yaw);
  const pitch = cl(-(rawPitch - gbias.pitch));
  if (!blink) {
    gazeRaw = {
      x: lm[168].x * CAM_W + Math.tan(yaw) * 350,
      y: lm[168].y * CAM_H + Math.tan(pitch) * 350,
      contact: Math.abs(yaw) < 0.17 && Math.abs(pitch) < 0.17,
    };
  }
}, 100);

// ---- the feedback loop -----------------------------------------------------
// fb      : what the filter will see this frame  = camera ⊕ warp(prevOut)
// prevOut : last frame's *rendered* output (so the hallucinated geometry
//           recurses too — that is what makes tunnels bloom)
const fb = document.createElement('canvas');
fb.width = CAM_W; fb.height = CAM_H;
const fbCtx = fb.getContext('2d', { willReadFrequently: true });
const prevOut = document.createElement('canvas');
prevOut.width = CAM_W; prevOut.height = CAM_H;
const prevCtx = prevOut.getContext('2d');
let hasPrev = false;

function drawCover(c, src, sw, sh) {
  const dAsp = CAM_W / CAM_H, sAsp = sw / sh;
  let cw = sw, ch = sh, cx = 0, cy = 0;
  if (sAsp > dAsp) { cw = sh * dAsp; cx = (sw - cw) / 2; }
  else { ch = sw / dAsp; cy = (sh - ch) / 2; }
  c.drawImage(src, cx, cy, cw, ch, 0, 0, CAM_W, CAM_H);
}

// ---- render loop with the adaptive resolution ladder -----------------------
const res = new URLSearchParams(location.search).get('res');
if (res && /^\d+x\d+$/.test(res)) {
  const [rw, rh] = res.split('x').map(Number);
  canvas.width = rw; canvas.height = rh;
}
let last = performance.now(), t0 = last, frames = 0, fpsShown = 0, uiTick = 0;
// the come-up: the first half minute barely touches the image, so you
// see your own room before it starts moving
const ONSET = 15;
const LADDER = [1, 0.8, 0.66, 0.5].map(s =>
    [Math.round(STAGE_W * s / 4) * 4, Math.round(STAGE_H * s / 4) * 4]);
canvas.width = LADDER[0][0]; canvas.height = LADDER[0][1];
let rung = 0, bodyCap = 1;
setInterval(() => {
  fpsShown = frames; frames = 0;
  if (res || mode === 'boot') return;
  // Down only: stepping back up caused a visible quality oscillation when
  // fps hovered around the thresholds. ?res=WxH overrides. GPU mode rides
  // the same ladder (phone GPUs pay the raymarch per pixel too); once the
  // bottom rung still can't hold, the 3D body bows out instead — the CPU
  // path's own economy, arrived at gradually.
  if (fpsShown > 0 && fpsShown < 24) {
    if (rung < LADDER.length - 1) ++rung;
    else bodyCap = Math.max(0, bodyCap - 0.34);
  }
  const [w, h] = LADDER[rung];
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
}, 1000);

function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const t = ((now - t0) / 1000) % 3600;

  if (mode === 'boot') {
    const st = fs.gStatus();
    if (st === 1) { mode = 'gpu'; }
    else if (st === 0 && now - bootAt < 6000) {
      bar.textContent = `WebGPU 初期化中… ${((now - bootAt) / 1000) | 0}s`;
      requestAnimationFrame(tick); return;
    } else {
      mode = 'cpu';
      // gInit claimed the canvas for WebGPU — the same node will refuse a
      // 2D context forever. Swap in a fresh twin before falling back.
      const fresh = canvas.cloneNode(false);
      canvas.replaceWith(fresh);
      canvas = fresh;
      ctx = canvas.getContext('2d');
      console.warn('WebGPU unavailable (status', st + '):', fs.gError());
    }
  }

  // effective parameters: the conductor wanders around the slider
  // baselines; unchecking 自動変容 pins them to the sliders exactly
  const eff = autoBox.checked ? conduct(t) :
      Object.fromEntries(Object.keys(DIMS).map(d => [d, Number(sl[d].value)]));

  // ---- 閉眼リセット ---------------------------------------------------------
  // Holding the eyes closed (not a blink) washes the trip away: the longer
  // they stay shut, the closer the world eases back to its freshly-loaded
  // state — parameters toward defaults, trail history fading out. A full
  // hold (~0.5 s total) commits the reset: sliders return home and the
  // conductor forgets where it was.
  const nowMs = performance.now();
  const closedHeld = gazechk.checked && eyeState === 'closed' &&
      nowMs - eyesClosedAt > 250 && nowMs - faceSeen < 1200;
  closedLevel = Math.min(1, Math.max(0,
      closedLevel + (closedHeld ? dt / 0.25 : -dt / 0.4)));
  if (closedLevel > 0) {
    prevCtx.fillStyle = `rgba(0,0,0,${Math.min(0.9, closedLevel * dt * 6).toFixed(3)})`;
    prevCtx.fillRect(0, 0, CAM_W, CAM_H);
    if (closedLevel >= 0.999 && cevArmed !== 'reset') {
      cevArmed = 'reset';
      tripT0 = t;                     // the come-up starts over
      for (const d in DIMS) {
        conductor.from[d] = 0;
        conductor.to[d] = 0;
        sl[d].value = DEFAULTS[d];
      }
      labels();
      conductor.next = t + 3;
      prevCtx.clearRect(0, 0, CAM_W, CAM_H);
      hasPrev = false;
    }
  } else if (cevArmed) {
    cevArmed = false;
  }
  // ---- カムアップ ------------------------------------------------------------
  // The trip builds: effect strength eases from a whisper (30%) toward the
  // sliders' full values in about thirty seconds. Closing the eyes drains
  // it in proportion, and a committed reset starts the climb from zero.
  const rise = (1 - Math.exp(-(t - tripT0) / 10)) * (1 - closedLevel);
  const lift = 0.3 + 0.7 * rise;
  for (const d in DIMS) {
    eff[d] *= lift;
  }
  if (blinkReset) {
    // a blink that ended the world: same as the held-closure reset
    blinkReset = false;
    bodyEpoch = 137 + Math.random() * 2800;   // and a reset births a new body
    tripT0 = t;
    for (const d in DIMS) {
      conductor.from[d] = 0;
      conductor.to[d] = 0;
      sl[d].value = DEFAULTS[d];
    }
    labels();
    conductor.next = t + 3;
    prevCtx.clearRect(0, 0, CAM_W, CAM_H);
    hasPrev = false;
  }
  if (blinkSnap) {
    // a blink the world noticed: one fast metastable jump — 「パッ」
    blinkSnap = false;
    bodyEpoch += 120 + Math.random() * 500;   // the glowing body wakes elsewhere
    for (const d in DIMS) {
      conductor.from[d] = currentOffset(d, t);
      conductor.to[d] = (Math.random() * 2 - 1) * DIMS[d].span;
    }
    conductor.t0 = t;
    conductor.dur = 0.25 + 0.35 * Math.random();
    conductor.next = t + 3 + 17 * -Math.log(1 - Math.random());
  }
  // show WHERE the conductor currently is: each readout becomes 基準→実効
  if (++uiTick % 10 === 0) {
    for (const d in DIMS) {
      const base = Number(sl[d].value).toFixed(2);
      sl[d].nextElementSibling.textContent =
          autoBox.checked ? `${base}→${eff[d].toFixed(2)}` : base;
    }
  }

  // one generation per ECHO_MS: camera in, history over it, into the scene.
  // Between generations the filter keeps animating at full fps — only the
  // recursion advances at its fixed, tuned cadence.
  if (video && video.readyState >= 2 && now - lastComposeAt >= ECHO_MS) {
    const dtGen = Math.min((now - lastComposeAt) / 1000, 0.5);
    lastComposeAt = now;
    // 1) fresh retinal input
    fbCtx.globalCompositeOperation = 'source-over';
    fbCtx.globalAlpha = 1;
    drawCover(fbCtx, video, video.videoWidth || 640, video.videoHeight || 360);
    // 2) re-enter the previous output: decayed, slightly zoomed + rotated.
    //    'lighten' keeps only the brighter history — the discrete frozen
    //    afterimages of true palinopsia; 'source-over' is the smooth smear.
    // the vortex pivots to the gaze point (eased); losing the face eases
    // it home. Holding eye contact deepens the trip.
    if (gazechk.checked && gazeRaw && performance.now() - faceSeen < 800) {
      gazePivot.x += (Math.max(0, Math.min(CAM_W, gazeRaw.x)) - gazePivot.x) * Math.min(1, dtGen * 5);
      gazePivot.y += (Math.max(0, Math.min(CAM_H, gazeRaw.y)) - gazePivot.y) * Math.min(1, dtGen * 5);
      contactLevel = Math.min(1, Math.max(0,
          contactLevel + (gazeRaw.contact ? dtGen / 2.5 : 0 - dtGen / 1.5)));
    } else {
      gazePivot.x += (CAM_W / 2 - gazePivot.x) * Math.min(1, dtGen * 2);
      gazePivot.y += (CAM_H / 2 - gazePivot.y) * Math.min(1, dtGen * 2);
      contactLevel = Math.max(0, contactLevel - dtGen / 1.5);
    }
    const persist = eff.persist;
    if (hasPrev && persist > 0) {
      const s = Math.exp(eff.zoom * dtGen * 4);
      const a = eff.rot * dtGen * 4;
      fbCtx.globalCompositeOperation = trailmode.value;
      // dt-normalized like zoom/rot above: the slider means retention per
      // 1/8 s of WALL time — dtGen, the time this GENERATION spans, keeps
      // it true at any display fps. A constant per-frame alpha made trail
      // life depend on frame rate — 0.55^60/s at 60 fps killed the tracers
      // the moment the page went WebGPU, while the ~8 fps CPU path kept
      // them ("CPUのほうがトリップ感ある" — the owner was right).
      fbCtx.globalAlpha = Math.pow(persist, dtGen * 8);
      // a whisper of blur per echo GENERATION: at 60 fps the buffer gets
      // resampled 7× more often than the old CPU path, and the zoom+rotate
      // interpolation error accumulated into visible stripes ("エフェクトが
      // バッファに残ってる" — the owner's read). 0.4 px per pass dissolves
      // the moiré before it can stack, and softens trails the dreamy way.
      fbCtx.filter = 'blur(0.4px)';
      fbCtx.imageSmoothingQuality = 'high';
      fbCtx.translate(gazePivot.x, gazePivot.y);
      fbCtx.scale(s, s);
      fbCtx.rotate(a);
      fbCtx.translate(-gazePivot.x, -gazePivot.y);
      fbCtx.drawImage(prevOut, 0, 0);
      fbCtx.setTransform(1, 0, 0, 1, 0, 0);
      fbCtx.filter = 'none';
      fbCtx.globalCompositeOperation = 'source-over';
      fbCtx.globalAlpha = 1;
    }
    // 3) feed the composite to the scene input
    const data = fbCtx.getImageData(0, 0, CAM_W, CAM_H).data;
    const ptr = fs.imageBuffer(inst, 'camera', CAM_W, CAM_H);
    mod.HEAPU8.set(data, ptr);
    fs.commitImage(inst, 'camera', CAM_W, CAM_H);
  }

  // 4) drive the filter — slot order from filters_def.h:
  //    trip, time, drift, geometry, chroma
  //    (geometry's SIGN selects the texture: + organic, − digital)
  const styleSign = document.getElementById('style').value === 'digital' ? -1 : 1;
  blinkPulse = Math.max(0, blinkPulse - dt * 1.6);
  const onset = Math.min(1, t / ONSET);
  const come = onset * onset;                    // slow at first, then arrives
  // one geometry at a time: as the 3D body rises, the filter's built-in
  // geometric overlay steps aside (never fully — dark scenes keep a trace)
  const bmix = mode === 'gpu'
      ? Math.min(0.7, (0.12 + 0.30 * eff.trip) * lift) * (1 - closedLevel) * bodyCap : 0;
  const geomDuck = 1 - 0.85 * bmix;
  fs.layerSetFilter(inst, 'live', 'lsd',
      Math.min(1.5, come * (eff.trip + 0.35 * contactLevel) + 0.22 * blinkPulse),
      t, come * eff.drift,
      styleSign * (come * eff.geometry * geomDuck + 0.25 * blinkPulse), eff.chroma);

  // 4.5) the 3D glowing body — GPU only, breathing with the trip
  if (mode === 'gpu') {
    fs.setPf(inst, 'bodymix', bmix);
    fs.layerSetFilter(inst, 'body', 'fractal',
        0.4, bodyEpoch + t * 0.55, 0.5 + 0.45 * lift, 0.8 + 0.6 * contactLevel, 0);
  }

  // 5) render, paint, and remember the output for the next re-entry
  if (mode === 'gpu') {
    fs.gRender(inst, dt, canvas.width, canvas.height);
    pumpEcho();
  } else {
    const px = fs.render(inst, dt, canvas.width, canvas.height);
    const w = fs.renderW(inst), h = fs.renderH(inst), stride = fs.renderStride(inst);
    if (w === canvas.width && stride === w * 4) {
      const view = new Uint8ClampedArray(mod.HEAPU8.buffer, px, w * h * 4);
      ctx.putImageData(new ImageData(view, w, h), 0, 0);
      prevCtx.drawImage(canvas, 0, 0, CAM_W, CAM_H);
      hasPrev = true;
    }
  }
  ++frames;
  const phase = autoBox.checked
      ? (t < conductor.t0 + conductor.dur
             ? T(`転移中 ${conductor.dur < 1.5 ? '(パッ)' : '(ゆっくり)'}`,
                 `shifting ${conductor.dur < 1.5 ? '(snap)' : '(slow)'}`)
             : T(`滞留 → 次の転移まで ${Math.max(0, conductor.next - t).toFixed(0)}s`,
                 `holding → next shift in ${Math.max(0, conductor.next - t).toFixed(0)}s`))
      : T('手動', 'manual');
  const climb = ` · 効き${Math.round(lift * 100)}%`;
  const eye = closedLevel > 0.3 ? ' · ↺ 初期化中…'
            : contactLevel > 0.5 ? ' · 👁アイコンタクト' : '';
  bar.textContent = `${mode} · ${canvas.width}x${canvas.height} · ${fpsShown} fps · 変容: ${phase}${climb}${eye}`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
