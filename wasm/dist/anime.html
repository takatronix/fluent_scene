<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>fluent scene — anime style (AnimeGANv3)</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 10px;
         background: radial-gradient(120% 120% at 50% 0%, #131822 0%, #07090d 70%);
         color: #dfe5ec; font: 14px/1.5 system-ui, sans-serif; }
  #v { display: block; max-width: 96vw; max-height: 78vh; aspect-ratio: 16 / 9;
       background: #000; border-radius: 14px;
       box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.5);
       touch-action: none; user-select: none; cursor: ew-resize; }
  #bar { font-family: ui-monospace, monospace; color: #7c8a99; font-size: 12px;
         white-space: pre-wrap; text-align: center; max-width: 96vw; }
  #ui { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, select { font: 13px system-ui, sans-serif; color: #dfe5ec;
         background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
         border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255,255,255,0.16); }
  #start { font-size: 15px; padding: 10px 26px;
           background: rgba(60,190,130,0.25); border-color: rgba(60,190,130,0.5); }
</style>
<canvas id="v" width="1280" height="720"></canvas>
<div id="ui">
  <button id="start">▶ start camera</button>
  <select id="model" title="style">
    <option value="models/AnimeGANv3_JP_face.onnx" selected>anime face (JP)</option>
    <option value="models/AnimeGANv3_PortraitSketch.onnx">portrait sketch (ink)</option>
    <option value="models/id_lineart.onnx">pencil lines (MIT)</option>
    <option value="models/tiny_lines.onnx">tiny pencil (ours, MIT)</option>
  </select>
  <select id="res" title="inference size">
    <option value="256">256px (bold)</option>
    <option value="384">384px</option>
    <option value="512" selected>512px (native)</option>
    <option value="768">768px (fine)</option>
    <option value="1024">1024px (finest)</option>
  </select>
  <button id="face" title="detect the face and stylize it at the scale the model was trained on">👤 face lock</button>
  <button id="flip" title="switch camera">🔄</button>
</div>
<div id="bar">AnimeGANv3 in your browser — drag on the video for an original | anime split.
Weights © TachibanaYoshino, non-commercial license (models/LICENSE.txt).</div>
<a href="https://x.com/takatronix" target="_blank" rel="noopener" style="position:fixed;right:12px;bottom:10px;z-index:9;font:11px ui-monospace,monospace;color:rgba(255,255,255,0.6);text-decoration:none;background:rgba(0,0,0,0.35);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)">fluent_scene · by <b style="color:rgba(255,255,255,0.85)">@takatronix</b></a>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
<script type="module">
// Anime-style AI filter — the analyzer pattern from the anime_style_filter
// design doc, Phase A. The GAN (AnimeGANv3, ~4 MB generator) runs OUTSIDE
// the engine: camera frame in, stylized frame out. "Person only" composes
// it with a second analyzer (MediaPipe selfie segmentation) the same way
// the engine's mask plumbing will (Phase C): mix(src, anime, mask).
//
// Model I/O (deploy/test_by_onnx.py): NHWC float32 RGB, x/127.5−1,
// H and W multiples of 8 (min 256), dynamic shape. Output in [−1, 1].
// URL knobs: ?ep=wasm forces the CPU path, ?auto=1 starts without a click
// (headless smoke), ?res=256 picks the ladder rung.
const bar = document.getElementById('bar');
const view = document.getElementById('v');
const vctx = view.getContext('2d');
const q = new URLSearchParams(location.search);

// The runtime comes from a CDN <script>; if that fetch failed, keep the page
// alive and say so instead of dying on the first `ort.` reference.
const haveOrt = typeof ort !== 'undefined';
if (haveOrt) {
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
  if (crossOriginIsolated) ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 1);
}

let session = null, epName = '?', busy = false, stream = null, facing = 'user';
const mk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const [srcCanvas, srcCtx] = mk();       // the exact frame the GAN sees
const [animeCanvas, animeCtx] = mk();   // raw GAN output
const [outCanvas, outCtx] = mk();       // composed frame we display
const [pairCanvas, pairCtx] = mk();     // full frame paired with a face crop
const video = document.createElement('video');
video.playsInline = true; video.muted = true;   // iOS: playsinline is the key

// ---- original | anime split compare ----------------------------------------
let split = 0;
function pointerSplit(e) {
  const r = view.getBoundingClientRect();
  split = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
}
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); pointerSplit(e); });
view.addEventListener('pointermove', e => { if (e.buttons) pointerSplit(e); });

// ---- GAN session: same-origin model, download progress, webgpu → wasm ------
async function fetchBuf(url) {
  const name = url.split('/').pop();
  const resp = await fetch(url);
  if (!resp.ok) { bar.textContent = 'model fetch failed: ' + resp.status; throw new Error(url); }
  const total = +resp.headers.get('content-length') || 0;
  const parts = []; let got = 0;
  for (const reader = resp.body.getReader();;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    bar.textContent = `downloading ${name}… ${(got / 1048576).toFixed(1)}` +
                      (total ? ` / ${(total / 1048576).toFixed(1)} MB` : ' MB');
  }
  const buf = new Uint8Array(got); let o = 0;
  for (const p of parts) { buf.set(p, o); o += p.length; }
  return buf;
}
async function loadModel(url) {
  session = null;
  if (!haveOrt) { bar.textContent = 'onnxruntime-web failed to load from the CDN — check the connection and reload'; throw new Error('no ort'); }
  let lastErr = null;
  for (const ep of (q.get('ep') ? [q.get('ep')] : ['webgpu', 'wasm'])) {
    // fp16 weights on the GPU (half the download, faster kernels); fp32 on CPU
    const file = ep === 'webgpu' ? url.replace('.onnx', '_fp16.onnx') : url;
    try {
      const buf = await fetchBuf(file);
      session = await ort.InferenceSession.create(buf, { executionProviders: [ep] });
      epName = ep; break;
    } catch (e) { lastErr = e; }
  }
  if (!session) { bar.textContent = 'model load failed: ' + lastErr; throw lastErr; }
  modelKind = /id_lineart|tiny_lines/.test(url) ? 'lines' : 'animegan';
}

// ---- face lock: detect -> square crop -> stylize -> paste back -------------
// The pretty AnimeGAN demos all feed the model a face at training scale.
// Feeding it a wide webcam frame is what produces the featureless blob.
let detector = null, detLoading = false, mpFiles = null, mpVision = null;
let faceEMA = null, lastFaceT = 0;
let faceLock = null;   // null = auto (on for face-trained models)
let modelKind = 'animegan';   // 'animegan' (NHWC ±1, RGB out) | 'lines' (NCHW 0..1, 1ch out)
const isFaceModel = url => /JP_face|PortraitSketch/.test(url);
const faceActive = () => faceLock !== null ? faceLock
                       : isFaceModel(document.getElementById('model').value);

async function mediapipe() {
  if (!mpVision) {
    const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    mpVision = await import(`${MP}/vision_bundle.mjs`);
    mpFiles = await mpVision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
  }
  return mpVision;
}
async function ensureDetector() {
  if (detector || detLoading) return;
  detLoading = true;
  try {
    const vision = await mediapipe();
    const make = delegate => vision.FaceDetector.createFromOptions(mpFiles, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite',
        delegate,
      },
      runningMode: 'VIDEO',
    });
    try { detector = await make('GPU'); }
    catch (e) { console.error('detector GPU delegate failed, retrying on CPU:', e); detector = await make('CPU'); }
  } catch (e) {
    console.error('face detector unavailable:', e);
    faceLock = false;
    updateFaceBtn();
  } finally { detLoading = false; }
}
function updateFaceBtn() {
  document.getElementById('face').classList.toggle('on', faceActive());
}
document.getElementById('face').addEventListener('click', () => {
  faceLock = !faceActive();
  if (faceLock) ensureDetector();
  updateFaceBtn();
});

// smoothed square crop around the face, with margin, clamped to the frame
function trackFace() {
  const res = detector.detectForVideo(video, performance.now());
  const det = res.detections && res.detections
      .reduce((a, b) => !a || (b.boundingBox.width > a.boundingBox.width) ? b : a, null);
  if (det) {
    const b = det.boundingBox;
    const size = Math.max(b.width, b.height) * 2.1;   // face + hair + chin
    const t = { cx: b.originX + b.width / 2, cy: b.originY + b.height * 0.42, size };
    if (!faceEMA) faceEMA = t;
    else {
      // deadband so the crop doesn't swim with every landmark wobble
      const db = faceEMA.size * 0.04;
      if (Math.abs(t.cx - faceEMA.cx) > db || Math.abs(t.cy - faceEMA.cy) > db
          || Math.abs(t.size - faceEMA.size) > faceEMA.size * 0.08) {
        const a = 0.25;
        faceEMA = { cx: faceEMA.cx + (t.cx - faceEMA.cx) * a,
                    cy: faceEMA.cy + (t.cy - faceEMA.cy) * a,
                    size: faceEMA.size + (t.size - faceEMA.size) * a };
      }
    }
    lastFaceT = performance.now();
  }
  if (!faceEMA || performance.now() - lastFaceT > 1500) return null;
  const vw = video.videoWidth, vh = video.videoHeight;
  let s = Math.min(faceEMA.size, vw, vh);
  let x = Math.min(Math.max(faceEMA.cx - s / 2, 0), vw - s);
  let y = Math.min(Math.max(faceEMA.cy - s / 2, 0), vh - s);
  return { x, y, s };
}

let featherCanvas = null;
function feather(S) {
  if (featherCanvas && featherCanvas.width === S) return featherCanvas;
  featherCanvas = document.createElement('canvas');
  featherCanvas.width = featherCanvas.height = S;
  const c = featherCanvas.getContext('2d');
  const pad = Math.round(S * 0.06);
  c.filter = `blur(${pad}px)`;
  c.fillStyle = '#fff';
  c.beginPath();
  c.roundRect(pad * 1.5, pad * 1.5, S - 3 * pad, S - 3 * pad, S * 0.18);
  c.fill();
  return featherCanvas;
}

// ---- camera -----------------------------------------------------------------
async function startCamera() {
  if (stream) for (const t of stream.getTracks()) t.stop();
  try {
    stream = await navigator.mediaDevices.getUserMedia(
      { video: { width: 1280, height: 720, facingMode: facing }, audio: false });
  } catch (e) {
    bar.textContent = 'webcam: ' + e + ' (needs https or localhost)';
    throw e;
  }
  video.srcObject = stream;
  await video.play();
}
document.getElementById('flip').addEventListener('click', async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  if (stream) await startCamera();
});

// ---- inference loop: capture → GAN (+ mask) → compose one coherent frame ---
const to8 = x => Math.max(256, x - x % 8);
let emaMs = 0, emaFps = 0, lastT = performance.now();

async function inferOnce() {
  if (!session || busy || video.readyState < 2) return;
  busy = true;
  try {
    const long = parseInt(document.getElementById('res').value, 10);
    const box = (faceActive() && detector) ? trackFace() : null;
    let w, h;
    if (box) {
      // face path: square crop at model-native scale, full frame kept as pair
      w = h = to8(long);
      pairCanvas.width = video.videoWidth; pairCanvas.height = video.videoHeight;
      pairCtx.drawImage(video, 0, 0);
      if (srcCanvas.width !== w || srcCanvas.height !== h) {
        srcCanvas.width = w; srcCanvas.height = h;
        animeCanvas.width = w; animeCanvas.height = h;
      }
      srcCtx.drawImage(video, box.x, box.y, box.s, box.s, 0, 0, w, h);
    } else {
      const ar = video.videoWidth / video.videoHeight || 16 / 9;
      let w0 = ar >= 1 ? long : long * ar, h0 = ar >= 1 ? long / ar : long;
      const up = 256 / Math.min(w0, h0);       // model minimum is 256 per side —
      if (up > 1) { w0 *= up; h0 *= up; }      // scale BOTH, never squash aspect
      w = Math.round(w0 / 8) * 8; h = Math.round(h0 / 8) * 8;
      if (srcCanvas.width !== w || srcCanvas.height !== h) {
        srcCanvas.width = w; srcCanvas.height = h;
        animeCanvas.width = w; animeCanvas.height = h;
      }
      srcCtx.drawImage(video, 0, 0, w, h);
    }

    const rgba = srcCtx.getImageData(0, 0, w, h).data;
    const n = w * h;
    const inp = new Float32Array(n * 3);
    let dims;
    if (modelKind === 'lines') {          // NCHW planes, 0..1
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        inp[i]         = rgba[j]     / 255;
        inp[n + i]     = rgba[j + 1] / 255;
        inp[2 * n + i] = rgba[j + 2] / 255;
      }
      dims = [1, 3, h, w];
    } else {                              // NHWC interleaved, -1..1
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        inp[i * 3]     = rgba[j]     / 127.5 - 1;
        inp[i * 3 + 1] = rgba[j + 1] / 127.5 - 1;
        inp[i * 3 + 2] = rgba[j + 2] / 127.5 - 1;
      }
      dims = [1, h, w, 3];
    }
    const t0 = performance.now();
    const out = (await session.run(
      { [session.inputNames[0]]: new ort.Tensor('float32', inp, dims) }))[session.outputNames[0]];
    emaMs = emaMs ? emaMs * 0.9 + (performance.now() - t0) * 0.1 : performance.now() - t0;

    const o = out.data;
    const pix = new Uint8ClampedArray(n * 4);
    if (modelKind === 'lines') {          // single channel line intensity, 0..1
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        const v = o[i] * 255;
        pix[j] = v; pix[j + 1] = v; pix[j + 2] = v; pix[j + 3] = 255;
      }
    } else {
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        pix[j]     = (o[i * 3]     + 1) * 127.5;
        pix[j + 1] = (o[i * 3 + 1] + 1) * 127.5;
        pix[j + 2] = (o[i * 3 + 2] + 1) * 127.5;
        pix[j + 3] = 255;
      }
    }
    animeCtx.putImageData(new ImageData(pix, w, h), 0, 0);

    // compose: whole frame from the paired source, so the stylized region
    // never smears against a newer camera frame
    if (box) {
      animeCtx.globalCompositeOperation = 'destination-in';
      animeCtx.drawImage(feather(w), 0, 0);
      animeCtx.globalCompositeOperation = 'source-over';
      if (outCanvas.width !== pairCanvas.width) {
        outCanvas.width = pairCanvas.width; outCanvas.height = pairCanvas.height;
      }
      outCtx.drawImage(pairCanvas, 0, 0);
      outCtx.drawImage(animeCanvas, box.x, box.y, box.s, box.s);
    } else {
      if (outCanvas.width !== w) { outCanvas.width = w; outCanvas.height = h; }
      outCtx.drawImage(animeCanvas, 0, 0);
    }

    const now = performance.now();
    emaFps = emaFps ? emaFps * 0.9 + 100 / (now - lastT) : 1000 / (now - lastT);
    lastT = now;
    bar.textContent = `${epName} · ${w}x${h}${box ? ' · face-lock' : ''} · infer ${emaMs.toFixed(0)} ms · ${emaFps.toFixed(1)} fps`
      + (epName === 'wasm' ? ' (no WebGPU — CPU fallback)' : '');
  } catch (e) {
    console.error(e);
    bar.textContent = 'inference error: ' + e;
  } finally { busy = false; }
}

function draw() {
  requestAnimationFrame(draw);
  if (video.readyState < 2) return;
  const W = view.width, H = view.height;
  if (outCanvas.width) vctx.drawImage(outCanvas, 0, 0, W, H);
  else vctx.drawImage(video, 0, 0, W, H);
  if (split > 0.002) {
    const sw = Math.round(split * W);
    vctx.drawImage(video, 0, 0, video.videoWidth * split, video.videoHeight, 0, 0, sw, H);
    vctx.fillStyle = 'rgba(255,255,255,0.8)';
    vctx.fillRect(sw - 1, 0, 2, H);
  }
  inferOnce();   // fire-and-forget; `busy` keeps queue depth at 1
}

const startBtn = document.getElementById('start');
async function start() {
  startBtn.disabled = true; startBtn.textContent = '…';
  try {
    await startCamera();                       // the user gesture turns the key (iOS)
    if (faceActive()) ensureDetector();        // fire-and-forget; full-frame until ready
    await loadModel(document.getElementById('model').value);
    startBtn.remove();
    draw();
  } catch (e) { startBtn.disabled = false; startBtn.textContent = '▶ start camera'; }
}
startBtn.addEventListener('click', start);
document.getElementById('model').addEventListener('change', async e => {
  updateFaceBtn();
  if (faceActive()) ensureDetector();
  if (!stream) return;
  const keep = session; session = null;      // pause the loop while swapping
  try { await loadModel(e.target.value); } catch (err) { session = keep; }
});
updateFaceBtn();
if (q.get('res')) document.getElementById('res').value = q.get('res');
if (q.get('m')) {
  const sel = document.getElementById('model');
  for (const o of sel.options) if (o.value.includes(q.get('m'))) sel.value = o.value;
  updateFaceBtn();
}
if (q.get('auto')) start();
</script>
