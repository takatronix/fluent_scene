<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fluent scene — WASM local</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 10px;
         background: radial-gradient(120% 120% at 50% 0%, #131822 0%, #07090d 70%);
         color: #dfe5ec; font: 14px/1.5 system-ui, sans-serif; }
  #v { display: block; max-width: 96vw; max-height: 86vh; aspect-ratio: 16 / 9;
       background: #000; border-radius: 14px;
       box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.5);
       touch-action: none; user-select: none; }
  #bar { font-family: ui-monospace, monospace; color: #7c8a99; font-size: 12px;
         white-space: pre-wrap; text-align: center; }
</style>
<canvas id="v" width="1280" height="720"></canvas>
<div id="bar">loading wasm…</div>
<script type="module">
// Everything happens in this tab: webcam capture, the Scene document, the
// water simulation, filters, compositing — the same C++ that runs on the
// robot, compiled to WebAssembly. No server round trip: touch feedback is
// as fast as the CPU renders.
import createFluentScene from './fluent_scene.mjs';

const SCENE = `
schema: fluent.scene/v1alpha2
stage: { size: [1280, 720] }
inputs:
  camera: { type: image.rgba8, update: per_frame }
params:
  load: { type: f32, default: 0, runtime_mutable: true,
          animate: { duration: 0.25, ease: ease_out } }
  portrait_off: { type: bool, default: true, runtime_mutable: true }
  face: { type: vec2, default: [640, 330], runtime_mutable: true,
          animate: { duration: 0.18, ease: ease_out } }
  face_inv: { type: vec2, default: [130, 160], runtime_mutable: true,
              animate: { duration: 0.18, ease: ease_out } }
layers:
  - id: water
    content: { image: { source: $inputs.camera, fit: cover } }
  - id: bgblur
    hidden: $params.portrait_off
    content: { image: { source: $inputs.camera, fit: cover } }
    filters: [ { blur: { radius: 16 } } ]
  - id: spotlight
    hidden: $params.portrait_off
    bounds: [0, 0, 280, 280]
    corner_radius: 140
    masks_to_bounds: true
    position: $params.face
    sublayers:
      - bounds: [0, 0, 1280, 720]
        position: $params.face_inv
        content: { image: { source: $inputs.camera, fit: cover } }
  - id: portrait_sw
    frame: [1166, 140, 76, 40]
    content: { switch: {} }
  - content: { text: { text: "portrait", position: [1166, 184], size: 14,
                       color: [1, 1, 1, 0.6] } }
  - id: hud
    position: [28, 24]
    opacity: 0.94
    shadow: {}
    sublayers:
      - content: { rect: { size: [420, 64], corner_radius: 16, color: [0, 0, 0, 0.42] } }
      - content: { text: { text: "FLUENT SCENE", position: [20, 8], size: 30 } }
      - content: { text: { text: "wasm / cpu renderer - in your browser", position: [20, 40],
                           size: 15, color: [1, 1, 1, 0.55] } }
  - id: meter
    content: { gauge: { center: [1204, 74], radius: 46, value: $params.load } }
  - content: { text: { text: "fps / 60", position: [1204, 126], size: 13, align: center,
                       color: [1, 1, 1, 0.55] } }
  - id: tiles
    position: [0, 566]
    sublayers:
      - content: { rect: { rect: [0, 0, 1280, 154], color: [0, 0, 0, 0.38] } }
      - id: t1
        frame: [14, 10, 236, 118]
        content: { image: { source: $inputs.camera, fit: cover } }
        corner_radius: 12
        masks_to_bounds: true
        filters: [ { toon: {} } ]
      - content: { text: { text: "toon", position: [22, 130], size: 14,
                           color: [1, 1, 1, 0.6] } }
      - id: t2
        frame: [266, 10, 236, 118]
        content: { image: { source: $inputs.camera, fit: cover } }
        corner_radius: 12
        masks_to_bounds: true
        filters: [ { sketch: {} } ]
      - content: { text: { text: "sketch", position: [274, 130], size: 14,
                           color: [1, 1, 1, 0.6] } }
      - id: t3
        frame: [518, 10, 236, 118]
        content: { image: { source: $inputs.camera, fit: cover } }
        corner_radius: 12
        masks_to_bounds: true
        filters: [ { halftone: {} } ]
      - content: { text: { text: "halftone", position: [526, 130], size: 14,
                           color: [1, 1, 1, 0.6] } }
      - id: t4
        frame: [770, 10, 236, 118]
        content: { image: { source: $inputs.camera, fit: cover } }
        corner_radius: 12
        masks_to_bounds: true
        filters: [ { hue: { angle: 150 } } ]
      - content: { text: { text: "hue", position: [778, 130], size: 14,
                           color: [1, 1, 1, 0.6] } }
      - id: t5
        frame: [1022, 10, 236, 118]
        content: { image: { source: $inputs.camera, fit: cover } }
        corner_radius: 12
        masks_to_bounds: true
        filters: [ { pixelate: {} } ]
      - content: { text: { text: "pixelate", position: [1030, 130], size: 14,
                           color: [1, 1, 1, 0.6] } }
`;

const bar = document.getElementById('bar');
const canvas = document.getElementById('v');
const ctx = canvas.getContext('2d');

const mod = await createFluentScene();
const fs = {
  create: mod.cwrap('fs_create', 'number', ['number']),
  error: mod.cwrap('fs_error', 'string', []),
  stageW: mod.cwrap('fs_stage_width', 'number', ['number']),
  stageH: mod.cwrap('fs_stage_height', 'number', ['number']),
  imageBuffer: mod.cwrap('fs_image_buffer', 'number', ['number', 'string', 'number', 'number']),
  commitImage: mod.cwrap('fs_commit_image', 'number', ['number', 'string', 'number', 'number']),
  pointer: mod.cwrap('fs_pointer', null, ['number', 'number', 'number', 'number']),
  attachRipple: mod.cwrap('fs_attach_ripple', 'number', ['number', 'string', 'number']),
  render: mod.cwrap('fs_render', 'number', ['number', 'number', 'number', 'number']),
  renderW: mod.cwrap('fs_render_width', 'number', ['number']),
  renderH: mod.cwrap('fs_render_height', 'number', ['number']),
  renderStride: mod.cwrap('fs_render_stride', 'number', ['number']),
  setParamF32: mod.cwrap('fs_set_param_f32', 'number', ['number', 'string', 'number']),
  setParamBool: mod.cwrap('fs_set_param_bool', 'number', ['number', 'string', 'number']),
  drainEvents: mod.cwrap('fs_drain_events', 'string', ['number']),
};

// Portrait spotlight: the circular sharp window over the blurred camera.
// Its center is a document param, so anything can drive it — the browser's
// FaceDetector when available, your pointer otherwise (on the robot, a YOLO
// person box would do the same through the identical param).
let portrait = false;
function setFace(x, y) {
  // Keep the window on canvas and counter-shift the inner image so its
  // pixels align with the background exactly.
  x = Math.max(60, Math.min(stageW - 60, x));
  y = Math.max(60, Math.min(stageH - 60, y));
  fsSetVec2('face', x, y);
  fsSetVec2('face_inv', 780 - x, 500 - y);
}

const setParamVec2 = mod.cwrap('fs_set_param_vec2', 'number', ['number', 'string', 'number', 'number']);
function fsSetVec2(name, x, y) { setParamVec2(inst, name, x, y); }

const yamlPtr = mod.stringToNewUTF8(SCENE);
const inst = fs.create(yamlPtr);
if (!inst) {
  bar.textContent = 'scene rejected:\n' + fs.error();
  throw new Error(fs.error());
}
fs.attachRipple(inst, 'water', 4);  // CPU budget: 4 waves max
const stageW = fs.stageW(inst), stageH = fs.stageH(inst);

// ---- pointer: straight into the local engine (zero network) ---------------
function hook(el) {
  let down = false;
  const send = (phase, e) => {
    const r = el.getBoundingClientRect();
    fs.pointer(inst, phase,
               (e.clientX - r.left) / r.width * stageW,
               (e.clientY - r.top) / r.height * stageH);
  };
  el.addEventListener('pointerdown', e => { down = true; el.setPointerCapture(e.pointerId); send(0, e); e.preventDefault(); });
  el.addEventListener('pointermove', e => {
    send(1, e);
    if (portrait) {
      const r = el.getBoundingClientRect();
      setFace((e.clientX - r.left) / r.width * stageW,
              (e.clientY - r.top) / r.height * stageH);
    }
  });
  el.addEventListener('pointerup', e => { down = false; send(2, e); });
}
hook(canvas);

// ---- webcam → wasm heap ----------------------------------------------------
// ?res=854x480 drops the render resolution for slower machines.
const res = new URLSearchParams(location.search).get('res');
if (res && /^\d+x\d+$/.test(res)) {
  const [rw, rh] = res.split('x').map(Number);
  canvas.width = rw; canvas.height = rh;
}
const CAM_W = 640, CAM_H = 480;
const grab = document.createElement('canvas');
grab.width = CAM_W; grab.height = CAM_H;
const grabCtx = grab.getContext('2d', { willReadFrequently: true });
let video = null;
try {
  const stream = await navigator.mediaDevices.getUserMedia(
      { video: { width: CAM_W, height: CAM_H }, audio: false });
  video = document.createElement('video');
  video.srcObject = stream; video.muted = true;
  await video.play();
} catch (e) {
  bar.textContent = 'webcam: ' + e + ' (needs https or localhost)';
}

// FaceDetector (Chrome, where available) auto-tracks; otherwise the
// spotlight follows your pointer.
if ('FaceDetector' in window) {
  const detector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
  setInterval(async () => {
    if (!portrait || !video || video.readyState < 2) return;
    try {
      const faces = await detector.detect(grab);
      if (faces.length) {
        const b = faces[0].boundingBox;
        // camera 640x480 → stage 1280x720 under cover fit (scale 2, y-offset 120)
        setFace((b.x + b.width / 2) * 2, (b.y + b.height / 2) * 2 - 120);
      }
    } catch (e) {}
  }, 250);
}

// ---- the loop: everything local -------------------------------------------
let last = performance.now(), frames = 0, fpsShown = 0;
// Adaptive resolution: SDF rendering is resolution-independent, so when the
// CPU falls behind we shrink the output (crisp, just fewer pixels) and grow
// it back when there is headroom.
const LADDER = [[1280, 720], [1024, 576], [854, 480], [640, 360]];
let rung = 0;
setInterval(() => {
  fpsShown = frames; frames = 0;
  if (res) return;  // explicit ?res= pins the resolution
  if (fpsShown < 24 && rung < LADDER.length - 1) ++rung;
  else if (fpsShown > 50 && rung > 0) --rung;
  const [w, h] = LADDER[rung];
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
}, 1000);

function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (video && video.readyState >= 2) {
    grabCtx.drawImage(video, 0, 0, CAM_W, CAM_H);
    const data = grabCtx.getImageData(0, 0, CAM_W, CAM_H).data;
    const ptr = fs.imageBuffer(inst, 'camera', CAM_W, CAM_H);
    mod.HEAPU8.set(data, ptr);
    fs.commitImage(inst, 'camera', CAM_W, CAM_H);
  }

  const px = fs.render(inst, dt, canvas.width, canvas.height);
  const w = fs.renderW(inst), h = fs.renderH(inst), stride = fs.renderStride(inst);
  if (w === canvas.width && stride === w * 4) {
    const view = new Uint8ClampedArray(mod.HEAPU8.buffer, px, w * h * 4);
    ctx.putImageData(new ImageData(view, w, h), 0, 0);
  }
  // UI events out of the document (the portrait switch lives in the scene).
  for (const line of fs.drainEvents(inst).split('\n')) {
    if (!line) continue;
    try {
      const e = JSON.parse(line);
      if (e.id === 'portrait_sw') {
        portrait = e.value > 0.5;
        fs.setParamBool(inst, 'portrait_off', portrait ? 0 : 1);
      }
    } catch (err) {}
  }
  ++frames;
  fs.setParamF32(inst, 'load', Math.min(fpsShown / 60, 1));
  bar.textContent = `${canvas.width}x${canvas.height} · ${fpsShown} fps · wasm/CPU renderer (WebGPU backend in progress) — touch the water`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
