<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fluent scene — gaze focus prototype</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 10px;
         background: radial-gradient(120% 120% at 50% 0%, #131822 0%, #07090d 70%);
         color: #dfe5ec; font: 14px/1.5 system-ui, sans-serif; }
  #wrap { position: relative; }
  #v { display: block; max-width: 96vw; max-height: 86vh; aspect-ratio: 16 / 9;
       background: #000; border-radius: 14px;
       box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.5);
       touch-action: none; user-select: none; }
  #pts { position: absolute; inset: 0; width: 100%; height: 100%;
         pointer-events: none; }
  #bar { font-family: ui-monospace, monospace; color: #7c8a99; font-size: 12px;
         white-space: pre-wrap; text-align: center; max-width: 96vw; }
</style>
<div id="wrap">
  <canvas id="v" width="1280" height="720"></canvas>
  <canvas id="pts" width="1280" height="720"></canvas>
</div>
<div id="bar">loading wasm…</div>
<a href="https://x.com/takatronix" target="_blank" rel="noopener" style="position:fixed;right:12px;bottom:10px;z-index:9;font:11px ui-monospace,monospace;color:rgba(255,255,255,0.6);text-decoration:none;background:rgba(0,0,0,0.35);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)">fluent_scene · by <b style="color:rgba(255,255,255,0.85)">@takatronix</b></a>
<script type="module">
// Gaze-focus prototype — Phase A analyzer for the fluent_scene analyzer design.
// The analyzer (MediaPipe Face Landmarker w/ iris, ~10 Hz) runs OUTSIDE the
// engine and feeds results through the same channels the robot would use:
// setParam vec2/bool. The scene shows a depth-of-field style focus window at
// the estimated gaze point and an EYE CONTACT pill.
//
// URL knobs (uncalibrated gaze needs per-setup tuning):
//   ?gain=700     px offset per tan(1rad) of gaze — bigger = focus moves farther
//   ?syaw=-1      flip horizontal sign     ?spitch=-1  flip vertical sign
//   ?eyegain=1.6  iris-offset → angle gain ?res=854x480 lower render resolution
import createFluentScene from './fluent_scene.mjs';

const SCENE = `
schema: fluent.scene/v1alpha2
stage: { size: [1280, 720] }
inputs:
  camera: { type: image.rgba8, update: per_frame }
params:
  focus_off: { type: bool, default: true, runtime_mutable: true }
  contact_off: { type: bool, default: true, runtime_mutable: true }
  gaze: { type: vec2, default: [640, 360], runtime_mutable: true,
          animate: { duration: 0.15, ease: ease_out } }
  gaze_inv: { type: vec2, default: [160, 160], runtime_mutable: true,
              animate: { duration: 0.15, ease: ease_out } }
layers:
  - id: camera_bg
    content: { image: { source: $inputs.camera, fit: cover } }
  - id: defocus
    hidden: $params.focus_off
    content: { image: { source: $inputs.camera, fit: cover } }
    filters: [ { blur: { radius: 9 } } ]
  - id: focus_win
    hidden: $params.focus_off
    bounds: [0, 0, 320, 320]
    corner_radius: 160
    masks_to_bounds: true
    position: $params.gaze
    sublayers:
      - bounds: [0, 0, 1280, 720]
        position: $params.gaze_inv
        content: { image: { source: $inputs.camera, fit: cover } }
  - id: dot
    hidden: $params.focus_off
    position: $params.gaze
    content: { rect: { rect: [-7, -7, 14, 14], corner_radius: 7, color: [0.3, 0.95, 0.65, 0.85] } }
  - id: hud
    position: [28, 24]
    opacity: 0.94
    shadow: {}
    sublayers:
      - content: { rect: { size: [460, 64], corner_radius: 16, color: [0, 0, 0, 0.42] } }
      - content: { text: { text: "GAZE FOCUS", position: [20, 8], size: 30 } }
      - content: { text: { text: "analyzer prototype - iris gaze -> focus param",
                           position: [20, 40], size: 15, color: [1, 1, 1, 0.55] } }
  - id: contact
    hidden: $params.contact_off
    position: [640, 46]
    sublayers:
      - content: { rect: { rect: [-110, 0, 220, 44], corner_radius: 22, color: [0.12, 0.55, 0.35, 0.75] } }
      - content: { text: { text: "EYE CONTACT", position: [0, 10], size: 20, align: center } }
`;

const bar = document.getElementById('bar');
let canvas = document.getElementById('v');
let ctx = null;

const q = new URLSearchParams(location.search);
const GAIN = parseFloat(q.get('gain') || '700');
const SYAW = parseFloat(q.get('syaw') || '1');
const SPITCH = parseFloat(q.get('spitch') || '-1');   // 3D pitch is Y-up, screen is Y-down
const EYEGAIN = parseFloat(q.get('eyegain') || '1.6');
const SEYEV = parseFloat(q.get('seyev') || '-1');   // vertical iris sign (field-tuned)

// Neutral-gaze bias: the camera rarely sits at eye height, so raw head pitch
// carries a constant offset. Assume the first seconds look at screen center,
// average them as the zero point; press "c" (or double-click) to redo anytime.
let bias = { yaw: 0, pitch: 0 };
try { const b = JSON.parse(localStorage.getItem('gaze_bias')); if (b) bias = b; } catch (e) {}
let calibSamples = localStorage.getItem('gaze_bias') ? null : [];
function startCalib() { calibSamples = []; }
addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') startCalib(); });
addEventListener('dblclick', startCalib);

// Landmark point overlay ("p" toggles). Drawn outside the engine — on the
// robot this would be a BoxesContent/points layer instead.
const ptsCanvas = document.getElementById('pts');
const ptsCtx = ptsCanvas.getContext('2d');
let showPts = true;
addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') { showPts = !showPts; if (!showPts) ptsCtx.clearRect(0, 0, 1280, 720); } });
function drawPoints(lm) {
  ptsCtx.clearRect(0, 0, 1280, 720);
  if (!showPts || !lm) return;
  ptsCtx.fillStyle = 'rgba(120, 215, 255, 0.55)';
  for (let i = 0; i < 468; i++) {
    const x = lm[i].x * 1280, y = lm[i].y * 960 - 120;
    ptsCtx.fillRect(x - 1, y - 1, 2, 2);
  }
  ptsCtx.fillStyle = 'rgba(80, 255, 170, 0.95)';   // iris points
  for (let i = 468; i < 478 && i < lm.length; i++) {
    const x = lm[i].x * 1280, y = lm[i].y * 960 - 120;
    ptsCtx.beginPath(); ptsCtx.arc(x, y, 3, 0, Math.PI * 2); ptsCtx.fill();
  }
}

const mod = await createFluentScene();
const fs = {
  create: mod.cwrap('fs_create', 'number', ['number']),
  error: mod.cwrap('fs_error', 'string', []),
  backend: mod.cwrap('fs_backend', 'string', []),
  stageW: mod.cwrap('fs_stage_width', 'number', ['number']),
  stageH: mod.cwrap('fs_stage_height', 'number', ['number']),
  imageBuffer: mod.cwrap('fs_image_buffer', 'number', ['number', 'string', 'number', 'number']),
  commitImage: mod.cwrap('fs_commit_image', 'number', ['number', 'string', 'number', 'number']),
  render: mod.cwrap('fs_render', 'number', ['number', 'number', 'number', 'number']),
  renderW: mod.cwrap('fs_render_width', 'number', ['number']),
  renderH: mod.cwrap('fs_render_height', 'number', ['number']),
  renderStride: mod.cwrap('fs_render_stride', 'number', ['number']),
  setParamBool: mod.cwrap('fs_set_param_bool', 'number', ['number', 'string', 'number']),
};
const setParamVec2 = mod.cwrap('fs_set_param_vec2', 'number', ['number', 'string', 'number', 'number']);

// ---- backend: WebGPU when available, CPU otherwise (same probe as demo.html)
let gpu = false;
try {
  if (navigator.gpu) {
    const gInit = mod.cwrap('fs_webgpu_init', null, ['string']);
    const gStatus = mod.cwrap('fs_webgpu_status', 'number', []);
    const gError = mod.cwrap('fs_webgpu_error', 'string', []);
    fs.gRender = mod.cwrap('fs_render_webgpu', 'number', ['number', 'number', 'number', 'number']);
    gInit('#v');
    bar.textContent = 'waiting for WebGPU device…';
    gpu = await new Promise(resolve => {
      const t0 = performance.now();
      (function poll() {
        const s = gStatus();
        if (s === 1) return resolve(true);
        if (s === -1) { console.error('WebGPU init failed:', gError()); return resolve(false); }
        if (performance.now() - t0 > 5000) return resolve(false);
        requestAnimationFrame(poll);
      })();
    });
  }
} catch (e) { gpu = false; }
if (!gpu) ctx = canvas.getContext('2d');
// Retina-sharp on the GPU: render at device pixels (CPU keeps 1280x720).
const DPR = Math.min(window.devicePixelRatio || 1, 2);
if (gpu && DPR > 1 && !q.get('res')) { canvas.width = 1280 * DPR; canvas.height = 720 * DPR; }
fs.gStatus = gpu ? mod.cwrap('fs_webgpu_status', 'number', []) : () => -1;

function fallbackToCpu(why) {
  if (!gpu) return;
  gpu = false;
  console.error('falling back to CPU renderer:', why);
  const fresh = canvas.cloneNode(false);
  fresh.width = 1280;   // drop any retina-scaled backing — CPU can't afford it
  fresh.height = 720;
  canvas.replaceWith(fresh);
  canvas = fresh;
  hookPointer(canvas);
  ctx = canvas.getContext('2d');
}

const yamlPtr = mod.stringToNewUTF8(SCENE);
const inst = fs.create(yamlPtr);
if (!inst) { bar.textContent = 'scene rejected:\n' + fs.error(); throw new Error(fs.error()); }
const stageW = fs.stageW(inst), stageH = fs.stageH(inst);

// Focus window center + counter-shift so the sharp pixels align with the
// blurred background (window 320px, R = 160 → inv = (W/2 + R - x, H/2 + R - y)).
function setGaze(x, y) {
  x = Math.max(80, Math.min(stageW - 80, x));
  y = Math.max(80, Math.min(stageH - 80, y));
  setParamVec2(inst, 'gaze', x, y);
  setParamVec2(inst, 'gaze_inv', 800 - x, 520 - y);
}

// ---- webcam, mirrored (selfie view: look left → focus moves left) ----------
const res = q.get('res');
if (res && /^\d+x\d+$/.test(res)) {
  const [rw, rh] = res.split('x').map(Number);
  canvas.width = rw; canvas.height = rh;
}
const CAM_W = 640, CAM_H = 480;
const grab = document.createElement('canvas');
grab.width = CAM_W; grab.height = CAM_H;
const grabCtx = grab.getContext('2d', { willReadFrequently: true });
grabCtx.setTransform(-1, 0, 0, 1, CAM_W, 0);   // mirror once, at capture
let video = null;
try {
  const stream = await navigator.mediaDevices.getUserMedia(
      { video: { width: CAM_W, height: CAM_H }, audio: false });
  video = document.createElement('video');
  video.srcObject = stream; video.muted = true;
  await video.play();
} catch (e) {
  bar.textContent = 'webcam: ' + e + ' (needs https or localhost)';
}

// ---- analyzer: MediaPipe Face Landmarker (iris) at ~10 Hz ------------------
// Falls back to FaceDetector (face-center only), then to pointer control.
let mode = 'pointer';
let landmarker = null;
let status = { yaw: 0, pitch: 0, eyeYaw: 0, eyePitch: 0, contact: false, blink: false };
let lastSeen = 0;

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
try {
  const vision = await import(`${MP}/vision_bundle.mjs`);
  const files = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
  const makeLandmarker = delegate => vision.FaceLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate,
    },
    outputFacialTransformationMatrixes: true,
    runningMode: 'VIDEO',
    numFaces: 1,
  });
  // The GPU delegate needs WebGL; environments without it (some headless /
  // remote setups) still run fine on the CPU delegate at 10 Hz.
  try {
    landmarker = await makeLandmarker('GPU');
  } catch (e) {
    console.error('MediaPipe GPU delegate failed, retrying on CPU:', e);
    landmarker = await makeLandmarker('CPU');
  }
  mode = 'iris';
} catch (e) {
  console.error('MediaPipe unavailable:', e);
  if ('FaceDetector' in window) mode = 'facebox';
}

// camera 640x480 → stage 1280x720 under cover fit: scale 2, y-offset -120
const toStage = (nx, ny) => [nx * CAM_W * 2, ny * CAM_H * 2 - 120];

// Landmark indices: eye corners R(33 outer,133 inner) L(362 inner,263 outer),
// lids R(159 top,145 bottom) L(386,374), iris centers R468 L473, bridge 168.
function irisOffset(lm, inner, outer, top, bottom, iris) {
  const w = lm[outer].x - lm[inner].x;
  const h = lm[bottom].y - lm[top].y;
  if (Math.abs(w) < 1e-4) return null;
  const open = Math.abs(h / w);
  return {
    hx: (lm[iris].x - lm[inner].x) / w - 0.5,
    vy: Math.abs(h) > 1e-4 ? (lm[iris].y - lm[top].y) / h - 0.5 : 0,
    open,
  };
}

function headPoseFromMatrix(m) {
  // Column-major 4x4; the face's forward axis is the 3rd column.
  const zx = m[8], zy = m[9], zz = m[10];
  return {
    yaw: Math.atan2(zx, Math.abs(zz)),
    pitch: Math.atan2(zy, Math.hypot(zx, zz)),
  };
}

async function analyze() {
  if (!video || video.readyState < 2) return;
  grabCtx.drawImage(video, 0, 0, CAM_W, CAM_H);

  if (mode === 'iris' && landmarker) {
    const r = landmarker.detectForVideo(grab, performance.now());
    if (r.faceLandmarks && r.faceLandmarks.length) {
      const lm = r.faceLandmarks[0];
      lastSeen = performance.now();

      let head = { yaw: 0, pitch: 0 };
      if (r.facialTransformationMatrixes && r.facialTransformationMatrixes.length)
        head = headPoseFromMatrix(r.facialTransformationMatrixes[0].data);

      const R = irisOffset(lm, 133, 33, 159, 145, 468);
      const L = irisOffset(lm, 362, 263, 386, 374, 473);
      let eyeYaw = 0, eyePitch = 0, blink = false;
      if (R && L) {
        blink = (R.open + L.open) / 2 < 0.09;
        if (!blink) {
          eyeYaw = ((R.hx + L.hx) / 2) * EYEGAIN;
          eyePitch = SEYEV * ((R.vy + L.vy) / 2) * EYEGAIN * 0.5;
        }
      }

      const rawYaw = head.yaw + eyeYaw;
      const rawPitch = head.pitch + eyePitch;
      if (calibSamples !== null && !blink) {
        calibSamples.push([rawYaw, rawPitch]);
        if (calibSamples.length >= 15) {
          bias.yaw = calibSamples.reduce((s, v) => s + v[0], 0) / calibSamples.length;
          bias.pitch = calibSamples.reduce((s, v) => s + v[1], 0) / calibSamples.length;
          localStorage.setItem('gaze_bias', JSON.stringify(bias));
          calibSamples = null;
        }
      }
      const clampA = a => Math.max(-0.9, Math.min(0.9, a));
      const yaw = clampA(SYAW * (rawYaw - bias.yaw));
      const pitch = clampA(SPITCH * (rawPitch - bias.pitch));
      status = { yaw, pitch, eyeYaw, eyePitch, contact: false, blink };

      if (!blink) {
        const [fx, fy] = toStage(lm[168].x, lm[168].y);
        setGaze(fx + Math.tan(yaw) * GAIN, fy + Math.tan(pitch) * GAIN);
        status.contact = Math.abs(yaw) < 0.17 && Math.abs(pitch) < 0.17;
      }
      fs.setParamBool(inst, 'focus_off', 0);
      fs.setParamBool(inst, 'contact_off', status.contact ? 0 : 1);
      drawPoints(lm);
      return;
    }
  } else if (mode === 'facebox') {
    try {
      if (!analyze.det) analyze.det = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      const faces = await analyze.det.detect(grab);
      if (faces.length) {
        const b = faces[0].boundingBox;
        lastSeen = performance.now();
        setGaze((b.x + b.width / 2) * 2, (b.y + b.height / 2) * 2 - 120);
        fs.setParamBool(inst, 'focus_off', 0);
      }
    } catch (e) {}
  }

  // Lost the face → the effect fades away quietly rather than jumping.
  if (performance.now() - lastSeen > 800) {
    fs.setParamBool(inst, 'focus_off', 1);
    fs.setParamBool(inst, 'contact_off', 1);
    ptsCtx.clearRect(0, 0, 1280, 720);
  }
}
setInterval(analyze, 100);   // ~10 Hz; the scene's animate smooths to 60 fps

// ---- pointer fallback ------------------------------------------------------
function hookPointer(el) {
  el.addEventListener('pointermove', e => {
    if (mode !== 'pointer') return;
    const r = el.getBoundingClientRect();
    setGaze((e.clientX - r.left) / r.width * stageW,
            (e.clientY - r.top) / r.height * stageH);
    fs.setParamBool(inst, 'focus_off', 0);
  });
}
hookPointer(canvas);

// ---- render loop -----------------------------------------------------------
let last = performance.now(), frames = 0, fpsShown = 0;
setInterval(() => { fpsShown = frames; frames = 0; }, 1000);
const deg = r => (r * 180 / Math.PI).toFixed(0);

function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (video && video.readyState >= 2) {
    grabCtx.drawImage(video, 0, 0, CAM_W, CAM_H);
    const data = grabCtx.getImageData(0, 0, CAM_W, CAM_H).data;
    const ptr = fs.imageBuffer(inst, 'camera', CAM_W, CAM_H);
    mod.HEAPU8.set(data, ptr);
    fs.commitImage(inst, 'camera', CAM_W, CAM_H);
  }

  if (gpu) {
    if (fs.gStatus() !== 1) fallbackToCpu('device left ready state');
    else if (!fs.gRender(inst, dt, canvas.width, canvas.height)) fallbackToCpu('fs_render_webgpu failed');
  }
  if (!gpu) {
    const px = fs.render(inst, dt, canvas.width, canvas.height);
    const w = fs.renderW(inst), h = fs.renderH(inst), stride = fs.renderStride(inst);
    if (w === canvas.width && stride === w * 4) {
      const view = new Uint8ClampedArray(mod.HEAPU8.buffer, px, w * h * 4);
      ctx.putImageData(new ImageData(view, w, h), 0, 0);
    }
  }
  ++frames;
  bar.textContent =
    `${canvas.width}x${canvas.height} · ${fpsShown} fps · wasm/${fs.backend()} · analyzer: ${mode}` +
    (mode === 'iris'
      ? `\ngaze yaw ${deg(status.yaw)}° pitch ${deg(status.pitch)}° · eye ${deg(status.eyeYaw)}°/${deg(status.eyePitch)}°` +
        ` · zero ${deg(bias.yaw)}°/${deg(bias.pitch)}°` +
        (calibSamples !== null ? ' · CALIBRATING (look at center)' : '') +
        (status.blink ? ' · blink' : '') + (status.contact ? ' · EYE CONTACT' : '') +
        `\n"c" = recalibrate · "p" = points ${showPts ? 'on' : 'off'} · ?gain=${GAIN} ?syaw=${SYAW} ?spitch=${SPITCH} ?eyegain=${EYEGAIN} ?seyev=${SEYEV}`
      : mode === 'facebox' ? '\nMediaPipe unreachable — following the face box only'
      : '\nno detector — move the pointer over the video');
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
