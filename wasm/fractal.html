<script type="module">
// fs_fractal — eternal flight through a self-morphing KIFS (mode 39).
// Everything on screen is a pure function of time — no randomness inside
// the filter, no frame state — so a "transition" can be architecture, not
// chaos: TWO universe layers, and a shift is a cross-dissolve to a fresh
// time epoch on the hidden one (the engine's declared-param animation does
// the easing). Blinking is the shutter: a blink dissolves to a nearby
// universe; holding the eyes closed wakes far away. No fast-forward, no
// strobing — one world breathes out while the next breathes in.
// Design: docs/design/fractal_filter.ja.md.
import createFluentScene from './fluent_scene.mjs';

const portrait = matchMedia('(orientation: portrait)').matches;
matchMedia('(orientation: portrait)').addEventListener('change', () => location.reload());
const STAGE_W = portrait ? 720 : 1280, STAGE_H = portrait ? 1280 : 720;

const SCENE = `
schema: fluent.scene/v1alpha2
stage: { size: [${STAGE_W}, ${STAGE_H}] }
inputs:
  seed: { type: image.rgba8 }
params:
  mixa: { type: f32, default: 1, runtime_mutable: true }
  mixb: { type: f32, default: 0, runtime_mutable: true,
          animate: { duration: 1.8, ease: ease_in_out } }
layers:
  - id: a
    frame: [0, 0, ${STAGE_W}, ${STAGE_H}]
    opacity: $params.mixa
    content: { image: { source: $inputs.seed, fit: cover } }
    filters: [ { fractal: { flight: 1, time: 0, morph: 1, glow: 1, blend: 0 } } ]
  - id: b
    frame: [0, 0, ${STAGE_W}, ${STAGE_H}]
    opacity: $params.mixb
    content: { image: { source: $inputs.seed, fit: cover } }
    filters: [ { fractal: { flight: 1, time: 0, morph: 1, glow: 1, blend: 0 } } ]
`;

const canvas = document.getElementById('v');
canvas.width = STAGE_W; canvas.height = STAGE_H;
const bar = document.getElementById('bar');
const mod = await createFluentScene();
const c = (n, r, a) => mod.cwrap(n, r, a);
const fs = {
  create: c('fs_create', 'number', ['number']),
  error: c('fs_error', 'string', []),
  imageBuffer: c('fs_image_buffer', 'number', ['number', 'string', 'number', 'number']),
  commitImage: c('fs_commit_image', 'number', ['number', 'string', 'number', 'number']),
  render: c('fs_render', 'number', ['number', 'number', 'number', 'number']),
  renderW: c('fs_render_width', 'number', ['number']),
  renderH: c('fs_render_height', 'number', ['number']),
  gInit: c('fs_webgpu_init', null, ['string']),
  gStatus: c('fs_webgpu_status', 'number', []),
  gError: c('fs_webgpu_error', 'string', []),
  gRender: c('fs_render_webgpu', 'number', ['number', 'number', 'number', 'number']),
  gReadBegin: c('fs_webgpu_read_begin', 'number', ['number', 'number', 'number', 'number']),
  gReadPixels: c('fs_webgpu_read_pixels', 'number', []),
  setPf: c('fs_set_param_f32', 'number', ['number', 'string', 'number']),
  layerSetFilter: c('fs_layer_set_filter', 'number',
      ['number', 'string', 'string', 'number', 'number', 'number', 'number', 'number']),
};

const inst = fs.create(mod.stringToNewUTF8(SCENE));
if (!inst) { bar.textContent = 'scene rejected: ' + fs.error(); throw new Error(fs.error()); }

// blend 0 ignores the source — a 2×2 OPAQUE black seed satisfies the
// binding (transparent would compose the whole layer away)
const sp = fs.imageBuffer(inst, 'seed', 2, 2);
mod.HEAPU8.fill(0, sp, sp + 16);
for (let i = 0; i < 4; ++i) mod.HEAPU8[sp + i * 4 + 3] = 255;
fs.commitImage(inst, 'seed', 2, 2);

document.getElementById('fsb').onclick = () =>
    document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
document.getElementById('cfg').onclick = () =>
    document.getElementById('hud').classList.toggle('open');
// on phones there is no gaze — a TAP on the piece is the blink instead
let lastTapAt = -1e9;
canvas.addEventListener('pointerdown', () => {
  const nowT = performance.now();
  if (nowT - lastTapAt < 2500) return;
  lastTapAt = nowT;
  lastCutAt = -1e9;
  instantCut((nowT - t0) / 1000);
});
// the piece owns the screen: all chrome fades after 3 s of stillness
let idleT = 0;
const wake = () => {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 3000);
};
for (const ev of ['pointermove', 'pointerdown', 'keydown', 'touchstart'])
  addEventListener(ev, wake, { passive: true });
wake();
const knob = id => document.getElementById(id).value / 100;
const logu = (lo, hi) => Math.exp(Math.log(lo) + Math.random() * (Math.log(hi) - Math.log(lo)));

// ---- two universes and the dissolve ----------------------------------------
// Layer b is the curtain: a shift loads a fresh epoch into the hidden layer
// and lets the engine's eased param animation dissolve to it. When the
// curtain is fully up or down, the covered layer's opacity is zeroed so the
// renderer culls it — idle cost is ONE raymarch, two only mid-dissolve.
const FADE = 1.8;
let offA = logu(50, 15000), offB = 0;      // every load opens somewhere new
let front = 'A';
let fade = { active: false, t0: 0 };
let zA = offA, zB = 0;                     // per-universe flight integrals
let lastShiftAt = -1e9, lastCutAt = -1e9, cutPulse = 0;
let rampUntil = 0;


// ---- measured-good landing catalogue ---------------------------------------
// A CPU sweep (0..3000 s, 2 s steps) rendered and scored every epoch with
// the same probe metrics; these are the stable stretches that LOOKED good
// (median coherence < 0.6). Warps, rescues, and idle page-turns land here —
// guaranteed structure. Blinks still jump free-range nearby: novelty for
// the deliberate, certainty for the automatic.
const GOOD = [[0,44],[48,54],[62,68],[72,94],[100,104],[150,298],[306,322],[326,334],[342,350],[380,400],[404,432],[436,446],[466,470],[478,488],[494,508],[512,526],[532,540],[550,568],[624,728],[744,764],[818,848],[852,974],[978,1198],[1238,1254],[1260,1278],[1282,1312],[1354,1362],[1368,1430],[1434,1446],[1478,1504],[1508,1512],[1568,1572],[1626,1632],[1660,1664],[1732,1736],[1756,1772],[1776,1896],[1910,1944],[1972,1980],[2000,2004],[2010,2014],[2018,2080],[2084,2338],[2358,2362],[2382,2390],[2396,2402],[2410,2416],[2424,2448],[2452,2460],[2466,2476],[2490,2494],[2536,2558],[2584,2632],[2636,2648],[2742,2748],[2758,2796],[2800,2910],[2914,2970],[2986,2998]];
function catalogOff(tNow, awayFromTe) {
  for (let i = 0; i < 12; ++i) {
    const iv = GOOD[(Math.random() * GOOD.length) | 0];
    const te = iv[0] + 1 + Math.random() * Math.max(1, iv[1] - iv[0] - 2);
    if (awayFromTe === undefined || Math.abs(te - awayFromTe) > 60) return te - tNow;
  }
  const iv = GOOD[(Math.random() * GOOD.length) | 0];
  return iv[0] + 2 - tNow;
}
// ---- landing audition ------------------------------------------------------
// A cut must LAND well. These mirror the filter's drive bank (same
// incommensurate sine sums), so we can ask of any candidate epoch: how fast
// are its clocks moving (post-landing churn) and are the structure clocks
// at extremes (sand-storm geometry)? Pure arithmetic, no rendering — a
// dozen auditions cost nothing, and only the calmest landing is taken.
const oscJs = (t, f, ph) => Math.sin(t * f + ph) +
    Math.sin(t * f * 1.6180339887 + ph * 2) + Math.sin(t * f * 0.3819660113 + ph * 4);
const doscJs = (t, f, ph) => f * (Math.cos(t * f + ph) +
    1.6180339887 * Math.cos(t * f * 1.6180339887 + ph * 2) +
    0.3819660113 * Math.cos(t * f * 0.3819660113 + ph * 4));
function calmScore(te) {
  const B = [[0.061, 0.7, 1.0], [0.047, 2.3, 0.8], [0.033, 4.1, 0.9],
             [0.043, 1.1, 0.6], [0.037, 3.9, 0.6], [0.029, 5.5, 0.5],
             [0.0165, 5.9, 1.2]];
  let s = 0;
  for (const [f, ph, w] of B) s += w * Math.abs(doscJs(te, f, ph)) / (3 * f);
  const wInv = Math.min(0.9, Math.max(0, 0.30 + 0.30 * oscJs(te, 0.0165, 5.9)));
  s += 1.2 * Math.max(0, wInv - 0.55);            // dusty deep-inversion landings
  s += 0.4 * Math.abs(oscJs(te, 0.033, 4.1)) / 3; // extreme fold-scale landings
  return s;
}
function auditionOff(cur, tNow, lo, hi) {
  let best = cur + logu(lo, hi), bs = Infinity;
  for (let i = 0; i < 14; ++i) {
    const cand = cur + logu(lo, hi);
    const s = calmScore(tNow + cand);
    if (s < bs) { bs = s; best = cand; }
  }
  return best;
}
// a blink is a hard cut: the visible universe swaps epochs while the eyes
// are still closed — reopen and the world is already different. No time
// interpolation, so nothing strobes; the seam is hidden inside the blink.
function instantCut(tNow, lo, hi) {
  const now = performance.now();
  if (now - lastCutAt < 8000 || fade.active) return;   // unconscious blinks pass through
  lastCutAt = now;
  // a blink cuts NEARBY (15–120 s): the slow weather barely moves, so the
  // mood stays continuous — same universe, different corridor
  if (front === 'A') { offA = auditionOff(offA, tNow, lo || 15, hi || 120); zA = 0; }
  else { offB = auditionOff(offB, tNow, lo || 15, hi || 120); zB = 0; }
  cutPulse = 1;                                        // a breath of light on reopen
  rampUntil = now + 2500;                              // the new place wakes gently
  // fast landing check: probe ~250 ms after the cut so a bad landing
  // (fog OR sand-storm) is escaped in well under a second
  lastProbeAt = now - 1250;
  postCutUntil = now + 4200;
}
let postCutUntil = 0;

// ---- boredom rescue --------------------------------------------------------
// The clocks can fly the camera into a hollow (fog) or a churn (sand-storm
// speckle). The clock audition cannot see either — so watch the PICTURE:
// every 1.5 s downsample the visible canvas into a tiny 2D canvas (no
// second render, no GPU readback machinery, no pipeline stall) and measure
// two things: luma variance (fog and blackness have almost none) and
// spatial coherence (speckle has variance but no form — neighbor
// difference over sigma runs near white noise's ~1.13; real structure
// 0.1–0.5). Bad twice running — or once, right after a landing — means
// nobody would keep watching: cut away. And rescues that keep failing
// stop after three and return to the last landing that looked good,
// instead of strobing through bad universes forever.
let flatStreak = 0, lastRescueAt = -1e9, lastProbeAt = 0, probeDead = 0;
let lastGoodOff = null, rescueChain = 0, probeInvalid = 0;
const probeCv = document.createElement('canvas');
probeCv.width = 96; probeCv.height = 54;
const probeCtx = probeCv.getContext('2d', { willReadFrequently: true });
function probeFrame(now) {
  if (probeDead >= 2 || mode === 'boot' || fade.active) return;
  if (now - lastProbeAt < 1500 || now - t0 < 3000) return;
  lastProbeAt = now;
  try {
    probeCtx.drawImage(canvas, 0, 0, 96, 54);
    const d = probeCtx.getImageData(0, 0, 96, 54).data;
    const n = 96 * 54;
    let s = 0, s2 = 0, sg = 0, sa = 0, prevL = 0;
    for (let i = 0; i < n; ++i) {
      const o = i * 4;
      const l = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
      s += l; s2 += l * l; sa += d[o + 3];
      if (i % 96 !== 0) sg += Math.abs(l - prevL);
      prevL = l;
    }
    if (sa / n < 16) {
      // the canvas read back EMPTY (alpha≈0): that is a read-timing
      // failure, never a verdict about the picture. Count it against the
      // probe itself and stand down if it keeps happening.
      if (++probeInvalid >= 3) { probeDead = 2; }
      return;
    }
    probeInvalid = 0;
    const mean = s / n, va = s2 / n - mean * mean;
    const ratio = (sg / (n - 54)) / Math.max(Math.sqrt(va), 1e-3);
    const bad = va < 60 || mean < 4 || ratio > 0.95;
    flatStreak = bad ? flatStreak + 1 : 0;
    if (!bad) { lastGoodOff = front === 'A' ? offA : offB; rescueChain = 0; }
  } catch (e) { console.warn('probe disabled:', e); probeDead = 2; }
}
function transition(tNow) {
  if (fade.active) return;
  const now = performance.now();
  if (now - lastShiftAt < 4000) return;
  lastShiftAt = now;
  const from = front === 'A' ? offA : offB;
  const newOff = catalogOff(tNow, tNow + from);
  if (front === 'A') {
    offB = newOff; zB = 0;                 // zB re-seeds on first drive below
    fs.setPf(inst, 'mixa', 1);
    fs.setPf(inst, 'mixb', 1);
  } else {
    offA = newOff; zA = 0;
    fs.setPf(inst, 'mixa', 1);
    fs.setPf(inst, 'mixb', 0);
  }
  fade = { active: true, t0: now };
}

// ---- gentle regime drift (no jumps — the dissolve owns the jumps) ----------
let regime = { flight: 1, morph: 1, glow: 1 };
let target = { ...regime };
let drift = { t0: -9, dur: 1 };
let nextDrift = 6;
const smooth = x => x * x * (3 - 2 * x);
function conducted(t) {
  if (t > nextDrift) {
    regime = { ...targetNow(t) };
    target = { flight: logu(0.2, 2.6), morph: 0.35 + Math.random() * 1.15,
               glow: logu(0.5, 2.2) };
    drift = { t0: t, dur: 3 + Math.random() * 4 };
    nextDrift = t + drift.dur + logu(8, 25);
  }
  return targetNow(t);
}
function targetNow(t) {
  const k = smooth(Math.max(0, Math.min(1, (t - drift.t0) / drift.dur)));
  return { flight: regime.flight + (target.flight - regime.flight) * k,
           morph: regime.morph + (target.morph - regime.morph) * k,
           glow: regime.glow + (target.glow - regime.glow) * k };
}

// ---- gaze (MediaPipe iris @10 Hz — the lsd.html analyzer, retargeted) ------
// The eyes steer the lean of the view; staring slows the flight and lights
// it up; a blink is the shutter between universes; a held closure wakes far
// from home. Ordinary tracking noise moves nothing abruptly.
const gazechk = document.getElementById('gazechk');
const CAM_W = portrait ? 360 : 640, CAM_H = portrait ? 640 : 360;
let video = null, landmarker = null;
let gaze = { yaw: 0, pitch: 0 }, gazeS = { yaw: 0, pitch: 0 };
let contact = false, contactLevel = 0, faceSeen = 0;
let wasBlink = false, eyeState = 'open', eyesClosedAt = 0;
let wantShift = false, wantWarp = false;
let gbias = { yaw: 0, pitch: 0 }, gcalib = [];
try {
  const b = JSON.parse(localStorage.getItem('fractal_gaze_bias') ||
                       localStorage.getItem('lsd_gaze_bias'));
  if (b) { gbias = b; gcalib = null; }
} catch (e) {}
const grab = document.createElement('canvas');
grab.width = CAM_W; grab.height = CAM_H;
const grabCtx = grab.getContext('2d', { willReadFrequently: true });
function drawCover(ctx2, src, sw, sh) {
  const dAsp = CAM_W / CAM_H, sAsp = sw / sh;
  let cw = sw, ch = sh, cx = 0, cy = 0;
  if (sAsp > dAsp) { cw = sh * dAsp; cx = (sw - cw) / 2; }
  else { ch = sw / dAsp; cy = (sh - ch) / 2; }
  ctx2.drawImage(src, cx, cy, cw, ch, 0, 0, CAM_W, CAM_H);
}
async function gazeUp() {
  if (video) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia(
        { video: { width: CAM_W, height: CAM_H }, audio: false });
    video = document.createElement('video');
    video.srcObject = stream; video.muted = true;
    await video.play();
    const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await import(`${MP}/vision_bundle.mjs`);
    const files = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const make = d => vision.FaceLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: d,
      },
      outputFacialTransformationMatrixes: true, runningMode: 'VIDEO', numFaces: 1,
    });
    try { landmarker = await make('GPU'); }
    catch (e) { landmarker = await make('CPU'); }
  } catch (e) { console.warn('gaze unavailable:', e); }
}
if (gazechk.checked) gazeUp();
gazechk.addEventListener('change', () => { if (gazechk.checked) gazeUp(); });
function irisOffset(lm, inner, outer, top, bottom, iris) {
  const w = lm[outer].x - lm[inner].x;
  const h = lm[bottom].y - lm[top].y;
  if (Math.abs(w) < 1e-4) return null;
  return {
    hx: (lm[iris].x - lm[inner].x) / w - 0.5,
    vy: Math.abs(h) > 1e-4 ? (lm[iris].y - lm[top].y) / h - 0.5 : 0,
    open: Math.abs(h / w),
  };
}
function headPose(m) {
  const zx = m[8], zy = m[9], zz = m[10];
  return { yaw: Math.atan2(zx, Math.abs(zz)),
           pitch: Math.atan2(zy, Math.hypot(zx, zz)) };
}
setInterval(() => {
  if (!landmarker || !gazechk.checked || !video || video.readyState < 2) return;
  drawCover(grabCtx, video, video.videoWidth || CAM_W, video.videoHeight || CAM_H);
  const r = landmarker.detectForVideo(grab, performance.now());
  if (!(r.faceLandmarks && r.faceLandmarks.length)) return;
  const lm = r.faceLandmarks[0];
  faceSeen = performance.now();
  let head = { yaw: 0, pitch: 0 };
  if (r.facialTransformationMatrixes && r.facialTransformationMatrixes.length) {
    head = headPose(r.facialTransformationMatrixes[0].data);
  }
  const R = irisOffset(lm, 133, 33, 159, 145, 468);
  const L = irisOffset(lm, 362, 263, 386, 374, 473);
  let eyeYaw = 0, eyePitch = 0, blink = false;
  if (R && L) {
    const openAvg = (R.open + L.open) / 2;
    blink = openAvg < 0.09;
    if (openAvg < 0.13) {
      if (eyeState !== 'closed') { eyeState = 'closed'; eyesClosedAt = performance.now(); }
    } else {
      if (eyeState === 'closed') {
        if (performance.now() - eyesClosedAt >= 450) { wantWarp = true; }
        else { wantShift = true; }         // a blink is the shutter
      }
      eyeState = 'open';
    }
    if (!blink) {
      eyeYaw = ((R.hx + L.hx) / 2) * 1.6;
      eyePitch = -((R.vy + L.vy) / 2) * 0.8;
    }
  }
  wasBlink = blink;
  const rawYaw = head.yaw + eyeYaw, rawPitch = head.pitch + eyePitch;
  if (gcalib !== null && !blink) {
    gcalib.push([rawYaw, rawPitch]);
    if (gcalib.length >= 15) {
      gbias.yaw = gcalib.reduce((s, v) => s + v[0], 0) / gcalib.length;
      gbias.pitch = gcalib.reduce((s, v) => s + v[1], 0) / gcalib.length;
      localStorage.setItem('fractal_gaze_bias', JSON.stringify(gbias));
      gcalib = null;
    }
  }
  const cl = a => Math.max(-0.9, Math.min(0.9, a));
  if (!blink) {
    gaze.yaw = cl(rawYaw - gbias.yaw);
    gaze.pitch = cl(-(rawPitch - gbias.pitch));
    contact = Math.abs(gaze.yaw) < 0.17 && Math.abs(gaze.pitch) < 0.17;
  }
}, 100);

// ---- render loop -----------------------------------------------------------
fs.gInit('#v');
let mode = 'boot';
let cpuCtx = null;
const t0 = performance.now();
let last = t0, frames = 0, fps = 0, fpsAt = t0;

// the loop must be unkillable: any exception is reported on the bar and the
// next frame still runs; a wedged probe or a dead present path degrades
// features instead of freezing the art
let renderOkAt = performance.now();
function tick() {
  try { tickBody(); }
  catch (e) { console.error(e); bar.textContent = '⚠ ' + (e && e.message ? e.message : e); }
  requestAnimationFrame(tick);
}
function tickBody() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const t = (now - t0) / 1000;

  if (mode === 'boot') {
    const st = fs.gStatus();
    if (st === 1) { mode = 'gpu'; renderOkAt = now; }
    else if (st === 0 && now - t0 < 6000) {
      bar.textContent = `WebGPU 初期化中… ${((now - t0) / 1000) | 0}s`;
      return;
    } else {
      mode = 'cpu';
      canvas.width = portrait ? 180 : 320;
      canvas.height = portrait ? 320 : 180;
      cpuCtx = canvas.getContext('2d');
      console.warn('WebGPU unavailable (status', st + '):', fs.gError());
    }
  }

  const auto = document.getElementById('auto').checked;
  // gaze influences: lean, slow-and-glow stare, blink shutter
  gazeS.yaw += (gaze.yaw - gazeS.yaw) * Math.min(1, dt * 6);
  gazeS.pitch += (gaze.pitch - gazeS.pitch) * Math.min(1, dt * 6);
  const tracking = gazechk.checked && now - faceSeen < 1500;
  contactLevel += ((tracking && contact ? 1 : 0) - contactLevel) * Math.min(1, dt * 1.2);
  canvas.style.transform = tracking
      ? `translate(${(-gazeS.yaw * 4).toFixed(2)}%, ${(gazeS.pitch * 4).toFixed(2)}%) scale(1.09)`
      : '';
  if (wantWarp) { transition(t); }          // held eyes: slow dissolve far away
  else if (wantShift) { instantCut(t); }               // blink: already elsewhere
  wantWarp = wantShift = false;
  // no face to blink for us? the piece still turns its own pages
  if (auto && !tracking && now - lastShiftAt > 25000) { transition(t); }

  // post-landing grace: the fresh universe's clocks run at 0.35× and ease
  // up to full speed over 2.5 s (flight speed is untouched — z rides its
  // own integral), so a cut never lands mid-churn
  if (now < rampUntil && !fade.active) {
    const k = 1 - (rampUntil - now) / 2500;
    const rate = 0.35 + 0.65 * smooth(k);
    if (front === 'A') { offA -= (1 - rate) * dt; } else { offB -= (1 - rate) * dt; }
  }

  // dissolve bookkeeping: when the curtain settles, cull the hidden layer
  let swell = 1;
  if (fade.active) {
    const k = Math.min(1, (now - fade.t0) / 1000 / FADE);
    swell = 1 + 0.55 * Math.sin(Math.PI * k);   // light blooms through the seam
    if (k >= 1) {
      fade.active = false;
      front = front === 'A' ? 'B' : 'A';
      if (front === 'B') { fs.setPf(inst, 'mixa', 0); }
    }
  }

  cutPulse = Math.max(0, cutPulse - dt * 2.5);
  const cc = auto ? conducted(t) : { flight: 1, morph: 1, glow: 1 };
  const gzFlight = 1 - 0.4 * contactLevel;
  const gzMorph = 1 + 0.15 * contactLevel;
  const gzGlow = (1 + 0.7 * contactLevel) * (1 + 0.5 * cutPulse);
  const flEff = knob('flight') * cc.flight * gzFlight;
  const morphV = knob('morph') * cc.morph * gzMorph;
  const glowV = knob('glow') * cc.glow * gzGlow * swell;
  const teA = t + offA, teB = t + offB;
  if (zA === 0) zA = teA;                       // fresh universes seed their integral
  if (zB === 0) zB = teB;
  zA += flEff * dt; zB += flEff * dt;
  // drive only what is visible: the hidden layer is culled by opacity 0
  const bVisible = fade.active || front === 'B';
  const aVisible = fade.active || front === 'A';
  if (aVisible) fs.layerSetFilter(inst, 'a', 'fractal', zA / teA, teA, morphV, glowV, 0);
  if (bVisible) fs.layerSetFilter(inst, 'b', 'fractal', zB / teB, teB, morphV, glowV, 0);

  if (mode === 'gpu') {
    if (fs.gRender(inst, dt, canvas.width, canvas.height)) { ++frames; renderOkAt = now; }
    else if (now - renderOkAt > 4000) {
      probeDead = 2;                        // prime suspect: the readback probe
      if (now - renderOkAt > 9000) location.reload();   // last resort: rebirth
    }
  } else {
    const px = fs.render(inst, dt, canvas.width, canvas.height);
    const w = fs.renderW(inst), h = fs.renderH(inst);
    cpuCtx.putImageData(new ImageData(
        new Uint8ClampedArray(mod.HEAPU8.buffer, px, w * h * 4), w, h), 0, 0);
    ++frames;
  }
  // boredom rescue: flat fog or sand-storm twice running — or once, right
  // after a landing — means nobody would keep watching; jump for them
  // (the probe reads the visible canvas, one frame stale — fine)
  probeFrame(now);
  const fastFail = now < postCutUntil && flatStreak >= 2;
  if ((flatStreak >= 3 || fastFail) && !fade.active &&
      now - lastRescueAt > (fastFail ? 1800 : 8000)) {
    flatStreak = 0;
    if (rescueChain >= 3 && lastGoodOff !== null) {
      // three bad landings in a row: stop strobing, go home to beauty
      if (front === 'A') { offA = lastGoodOff + 2; zA = 0; }
      else { offB = lastGoodOff + 2; zB = 0; }
      rampUntil = now + 2500; cutPulse = 1; rescueChain = 0;
      lastRescueAt = now + 8000;            // and hold all rescues a while
    } else {
      lastRescueAt = now;
      ++rescueChain;
      const esc = catalogOff(t, t + (front === 'A' ? offA : offB));
      if (front === 'A') { offA = esc; zA = 0; } else { offB = esc; zB = 0; }
      cutPulse = 1; rampUntil = now + 2500;
      lastProbeAt = now - 1250; postCutUntil = now + 4200;
    }
  }

  if (now - fpsAt > 1000) { fps = frames; frames = 0; fpsAt = now; }
  const hh = (t / 3600) | 0, mm = ((t / 60) | 0) % 60, ss = (t | 0) % 60;
  const phase = fade.active ? '転移中 ⟿ 別宇宙へディゾルブ'
      : tracking ? '滞留 (瞬き=パッ / 長閉眼=遠くへ)'
      : '滞留';
  const eye = !gazechk.checked ? '' : !tracking ? ' · 👁…'
      : contactLevel > 0.5 ? ' · 👁凝視' : ' · 👁';
  bar.textContent = `${mode} · ${fps} fps · ${phase}${eye} · 飛行 ${hh}h${String(mm).padStart(2, '0')}m${String(ss).padStart(2, '0')}s`;
}
requestAnimationFrame(tick);
</script>
</html>
